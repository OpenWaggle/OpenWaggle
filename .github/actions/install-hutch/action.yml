name: Install Hutch
description: Installs the exact Hutch version that builds the pinned Electrobun release (vendor/electrobun/sources.ts HUTCH_VERSION) with Hutch's own installer, which checks the archive's sha256, and puts it on PATH.

inputs:
  version:
    description: Exact Hutch version.
    required: false
    default: "0.29.0"

runs:
  using: composite
  steps:
    - name: Install Hutch (macOS, Linux)
      if: runner.os != 'Windows'
      shell: bash
      env:
        HUTCH_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        installer="$RUNNER_TEMP/install-hutch.sh"
        curl --proto '=https' --tlsv1.2 -fsSL https://hutch.blackboard.sh/hutch/install.sh -o "$installer"
        sh "$installer" --version "$HUTCH_VERSION" --no-modify-path
        echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
        "$HOME/.hutch/bin/hutch" --version

    - name: Install Hutch (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        HUTCH_VERSION: ${{ inputs.version }}
      run: |
        $installer = Join-Path $env:RUNNER_TEMP "install-hutch.ps1"
        Invoke-WebRequest -UseBasicParsing -Uri "https://hutch.blackboard.sh/hutch/install.ps1" -OutFile $installer
        & $installer -Version $env:HUTCH_VERSION -NoModifyPath
        if ($LASTEXITCODE -ne 0) { throw "Hutch installation failed" }
        $bin = Join-Path $HOME ".hutch\bin"
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append
        & (Join-Path $bin "hutch.exe") --version
