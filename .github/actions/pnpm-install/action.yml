name: Install dependencies with pnpm
description: Runs pnpm install --frozen-lockfile with bounded retries against transient registry and postinstall network failures, and optionally fetches the Electron binary the same way.

inputs:
  electron-binary:
    description: Fetch the Electron binary up front, with retries, instead of on its first use.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        attempt=1
        while true; do
          # pnpm-workspace.yaml allows 10 minutes per download for slow home connections. A
          # runner's link is fast, so a stalled request fails after 1 minute into this retry loop.
          if pnpm install --frozen-lockfile --fetch-timeout 60000; then
            exit 0
          fi
          if [ "$attempt" -ge 3 ]; then
            echo "pnpm install failed after $attempt attempts." >&2
            exit 1
          fi
          echo "pnpm install failed (attempt $attempt); retrying in 15s." >&2
          attempt=$((attempt + 1))
          sleep 15
        done

    # Electron 43 downloads its binary the first time anything requires `electron`, with no
    # retry. A single 504 from GitHub's release CDN failed a whole job mid-check, and parallel
    # test workers can each start that download. Fetch it once here, with retries.
    - name: Fetch the Electron binary
      if: ${{ inputs.electron-binary == 'true' }}
      shell: bash
      run: |
        attempt=1
        while true; do
          if node node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -ge 3 ]; then
            echo "Electron binary download failed after $attempt attempts." >&2
            exit 1
          fi
          echo "Electron binary download failed (attempt $attempt); retrying in 15s." >&2
          attempt=$((attempt + 1))
          sleep 15
        done
