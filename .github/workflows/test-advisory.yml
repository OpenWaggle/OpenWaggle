# Advisory, never required: names each test file a pull request adds that covers no statement or
# branch arm the nightly coverage-uniqueness index lacks (.agents/standards.md, Testing). It runs the check runner's
# advisory `coverage-uniqueness` step, which exits 0 whatever it finds; the findings show as
# notices on the files and in the job summary. Zero unique coverage is a candidate for review,
# not a verdict: contract and refusal tests legitimately show none.
name: Test advisory

on:
  pull_request:
    paths:
      - "**/*.test.ts"
      - "**/*.test.tsx"

permissions:
  contents: read
  # Reads the nightly coverage-uniqueness-index artifact.
  actions: read

concurrency:
  group: test-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage-uniqueness:
    name: New test coverage uniqueness (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/bun-install
        with:
          electron-binary: "true"

      - name: Compare new test files with the nightly index
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/check/run.ts check --only coverage-uniqueness

      - name: Publish the advisories
        if: always()
        run: bun scripts/check/job-summary.ts
