name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact commit SHA to validate.
        required: true
        type: string
      ci_tier:
        description: Check tier for the dispatched run.
        required: false
        type: choice
        default: full
        options:
          - full
          - fast
          - visual

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Makes `pnpm check:installer` fail when NSIS is absent instead of skipping, so the
  # installer compile check cannot silently stop running in CI.
  REQUIRE_NSIS: '1'
  # E2E worker count. Each E2E test launches its own Electron instance with isolated user
  # data, so two workers halve suite wall-clock; override to '1' if parallel flakes appear.
  PLAYWRIGHT_WORKERS: '2'

# Pull-request runs cancel superseded runs for the same PR. Merge-queue runs are never
# cancelled here: each queue entry validates one speculative merge result, and killing it
# would fail the queue instead of yielding a useful signal.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  commit-policy:
    name: Commit Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify dispatched commit identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCHED_SHA" = "$EXPECTED_SHA"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - run: pnpm exec tsx scripts/release-ci-policy.ts

      - name: Validate Conventional Commits
        env:
          COMMIT_POLICY_FROM: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          COMMIT_POLICY_TO: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || '' }}
        run: pnpm exec tsx scripts/check-conventional-commits.ts --from "$COMMIT_POLICY_FROM" --to "$COMMIT_POLICY_TO" --pr-title "$PR_TITLE"

  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify dispatched commit identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCHED_SHA" = "$EXPECTED_SHA"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - name: Install NSIS for the installer script check
        run: sudo apt-get update && sudo apt-get install -y nsis

      - run: pnpm check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify dispatched commit identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCHED_SHA" = "$EXPECTED_SHA"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - run: pnpm test:unit

  test-integration-component:
    name: Integration & Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify dispatched commit identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCHED_SHA" = "$EXPECTED_SHA"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - run: pnpm test:integration && pnpm test:component

  test-mcp-conformance:
    name: MCP Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify dispatched commit identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCHED_SHA" = "$EXPECTED_SHA"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - run: pnpm prepare:native:node && pnpm test:mcp:conformance

  changes:
    name: Detect Changed Surfaces
    timeout-minutes: 10
    # Push runs never trigger path-scoped jobs, so change detection is only needed for
    # pull requests, merge-queue validation, and dispatched runs.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.filter.outputs.package }}
      website-docs: ${{ steps.filter.outputs.website-docs }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - name: Resolve changed surfaces
        id: filter
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE_SHA}"
          if [ -z "$base" ]; then
            base="$(git rev-parse origin/main)"
          fi
          merge_base="$(git merge-base "$base" HEAD)"
          changed="$(git diff --name-only "$merge_base" HEAD)"
          echo "Changed files relative to $merge_base:"
          printf '%s\n' "$changed"

          package_pattern='^(packages/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|scripts/package-|release-please-config\.json$|\.release-please-manifest\.json$|tests/fixtures/package-smoke/)'
          website_docs_pattern='^(website/|docs/|packages/|scripts/package-documentation\.ts$|scripts/generate-installed-docs\.ts$)'

          if printf '%s\n' "$changed" | grep -qE "$package_pattern"; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          else
            echo "package=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed" | grep -qE "$website_docs_pattern"; then
            echo "website-docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "website-docs=false" >> "$GITHUB_OUTPUT"
          fi

  electron-e2e-macos:
    name: Electron E2E (macOS)
    # The merge queue and dispatched runs validate E2E; main pushes stay a static canary.
    if: github.event_name != 'push'
    # macOS runs both the shared functional suite and the native Darwin visual baselines.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Verify dispatched commit identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCHED_SHA" = "$EXPECTED_SHA"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - run: pnpm benchmark:syntax
        env:
          SYNTAX_BENCHMARK_PROFILE: performance/syntax-budgets/macos-arm64-github-hosted.json

      - name: Run Electron E2E (full suite including visual baselines)
        if: github.event_name != 'workflow_dispatch' || inputs.ci_tier != 'visual'
        run: pnpm test:e2e

      - name: Run Electron E2E (visual baselines only)
        if: github.event_name == 'workflow_dispatch' && inputs.ci_tier == 'visual'
        run: pnpm test:e2e:visual

      - name: Upload Electron E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-e2e-macos-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Electron E2E Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-e2e-macos-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  electron-e2e-linux:
    name: Electron E2E (Linux)
    # Linux and Windows E2E only gate the merge-queue result and dispatched full runs.
    # Per-push iteration runs the macOS suite so the dev loop stays fast and deterministic.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.ci_tier == 'full')
    steps:
      - name: Verify dispatched commit identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$DISPATCHED_SHA" = "$EXPECTED_SHA"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - name: Install Linux Electron dependencies
        run: pnpm exec playwright install-deps chromium

      - run: xvfb-run --auto-servernum pnpm test:e2e:functional

      - name: Upload Electron E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-e2e-linux-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Electron E2E Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-e2e-linux-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  electron-e2e-windows:
    name: Electron E2E (Windows)
    runs-on: windows-latest
    # Windows builds and runs the functional Electron suite serially. The Session
    # Summary parity coverage takes this job beyond the previous 20-minute ceiling,
    # which cancelled Playwright before it could report failures or upload traces.
    timeout-minutes: 40
    if: github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.ci_tier == 'full')
    steps:
      - name: Verify dispatched commit identity
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$') { exit 1 }
          if ($env:DISPATCHED_SHA -ne $env:EXPECTED_SHA) { exit 1 }

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - run: pnpm test:e2e:functional

      - name: Upload Electron E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-e2e-windows-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Electron E2E Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-e2e-windows-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  package-release-rehearsal-package:
    name: Package Consumer Rehearsal (Node 22.19.0)
    needs: changes
    # Release-shaped validation runs against the merged result only. The release branch
    # always rehearses so the coordinated package release path is never under-validated.
    if: >-
      (github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.ci_tier == 'full')) &&
      (needs.changes.outputs.package == 'true' || (github.head_ref || github.ref_name) == 'release-please--branches--main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - name: Checkout immutable package consumer tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts/package-consumer-tools.ts
          sparse-checkout-cone-mode: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: ./.github/actions/pnpm-install

      - name: Install pinned package manager consumers
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .release-tooling/scripts/package-consumer-tools.ts install --tool-root "$RUNNER_TEMP/package-managers" --github-path "$GITHUB_PATH"

      - name: Verify package manager consumer versions
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .release-tooling/scripts/package-consumer-tools.ts verify --tool-root "$RUNNER_TEMP/package-managers"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for package browser smoke
        run: pnpm exec playwright install chromium

      - name: Rehearse npm, pnpm, Yarn, Bun, and browser consumers
        env:
          OPENWAGGLE_PACKAGE_BROWSER_SMOKE: '1'
          OPENWAGGLE_PACKAGE_SMOKE_REQUIRED_MANAGERS: 'npm,pnpm,yarn,bun'
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: pnpm package:smoke

  package-release-rehearsal-website:
    name: Website & Docs Rehearsal (Node 24.14.0)
    timeout-minutes: 25
    needs: changes
    if: >-
      (github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.ci_tier == 'full')) &&
      (needs.changes.outputs.website-docs == 'true' || (github.head_ref || github.ref_name) == 'release-please--branches--main')
    runs-on: ubuntu-latest
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: ./.github/actions/pnpm-install

      - name: Rehearse website and documentation gates
        run: |
          pnpm website:build
          pnpm website:test
          pnpm docs:generate

  classify-package-release:
    name: Classify Package Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prepare: ${{ steps.candidate.outputs.prepare }}
    steps:
      - name: Classify package release candidate
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch="$HEAD_REF"
          if [[ -z "$branch" ]]; then
            branch="$REF_NAME"
          fi
          if [[ "$branch" != "release-please--branches--main" ]]; then
            echo "prepare=false" >> "$GITHUB_OUTPUT"
            echo "This pull request does not contain a coordinated package release candidate."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" && ( "$HEAD_REPOSITORY" != "$REPOSITORY" || "$PR_AUTHOR" != "github-actions[bot]" ) ]]; then
            echo "Release candidate pull requests must belong to this repository and the GitHub Actions bot." >&2
            exit 1
          fi
          echo "prepare=true" >> "$GITHUB_OUTPUT"

  prepare-package-release:
    name: Build and attest package artifacts (Release Please PR only)
    timeout-minutes: 40
    needs: classify-package-release
    if: needs.classify-package-release.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.15.1

      - name: Checkout immutable package consumer tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tooling
          sparse-checkout: scripts/package-consumer-tools.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: ./.github/actions/pnpm-install

      - name: Install pinned package manager consumers
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .release-tooling/scripts/package-consumer-tools.ts install --tool-root "$RUNNER_TEMP/package-managers" --github-path "$GITHUB_PATH"

      - name: Verify package manager consumer versions
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .release-tooling/scripts/package-consumer-tools.ts verify --tool-root "$RUNNER_TEMP/package-managers"

      - name: Rehearse static, docs, website, and API gates
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: |
          pnpm check:fast
          pnpm package-release:validate
          pnpm api:snapshot:check
          pnpm package-docs:check
          pnpm --filter @openwaggle/website build
          pnpm website:test
          pnpm docs:generate

      - run: pnpm build:packages

      - name: Resolve exact Release Please package plan
        id: plan
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/package-release-plan.ts "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'origin/main' }}" "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}" "$RUNNER_TEMP/package-release-plan.json"

      - name: Build and verify exact package tarballs
        run: pnpm exec tsx scripts/package-release-artifacts.ts prepare "$RUNNER_TEMP/package-release-plan.json" "$RUNNER_TEMP/package-release-artifacts"

      - name: Install Chromium for canonical package browser smoke
        run: pnpm exec playwright install chromium

      - name: Smoke exact canonical npm, pnpm, Yarn, Bun, and browser consumers
        env:
          OPENWAGGLE_PACKAGE_BROWSER_SMOKE: '1'
          OPENWAGGLE_PACKAGE_SMOKE_REQUIRED_MANAGERS: 'npm,pnpm,yarn,bun'
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: pnpm package:smoke --tarball-dir "$RUNNER_TEMP/package-release-artifacts"

      - name: Attest package tarballs and release manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/package-release-artifacts/*

      - name: Upload immutable package release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: ${{ runner.temp }}/package-release-artifacts
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  package-release-candidate:
    name: Package Release Candidate
    needs:
      - classify-package-release
      - prepare-package-release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Enforce package release candidate readiness
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/package-release-candidate-gate.ts "${{ needs.classify-package-release.result }}" "${{ needs.prepare-package-release.result }}" "${{ github.head_ref || github.ref_name }}"

  package-release-gate:
    name: Package Release Gate
    timeout-minutes: 10
    needs:
      - commit-policy
      - check
      - test-unit
      - test-integration-component
      - test-mcp-conformance
      - changes
      - electron-e2e-macos
      - electron-e2e-linux
      - electron-e2e-windows
      - package-release-rehearsal-package
      - package-release-rehearsal-website
      - package-release-candidate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      CI_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.ci_tier || github.event_name == 'merge_group' && 'full' || github.event_name == 'push' && 'fast-no-e2e' || 'fast' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Enforce package release readiness
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/package-release-gate.ts "$CI_TIER" "${{ needs.commit-policy.result }}" "${{ needs.check.result }}" "${{ needs.changes.result }}" "${{ needs.test-unit.result }}" "${{ needs.test-integration-component.result }}" "${{ needs.test-mcp-conformance.result }}" "${{ needs.electron-e2e-macos.result }}" "${{ needs.electron-e2e-linux.result }}" "${{ needs.electron-e2e-windows.result }}" "${{ needs.package-release-rehearsal-package.result }}" "${{ needs.package-release-rehearsal-website.result }}" "${{ needs.package-release-candidate.result }}"
