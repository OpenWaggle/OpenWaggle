# Mirrors pingdotgg/t3code .github/workflows/ci.yml: a lean per-change gate
# (check + test + release smoke) that runs on pull requests and on the push to
# main, with no merge queue. Adapted to OpenWaggle's toolchain (pnpm + Node)
# instead of t3code's Vite+/blacksmith infra, and without their Rust/mobile/
# server jobs, which OpenWaggle does not have.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Check
        run: pnpm check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Install terminal integration shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Test
        run: pnpm test:unit && pnpm test:integration && pnpm test:component

  # Mirrors t3code's release_smoke: exercise the release-only build path on
  # every change so a broken production bundle surfaces here, not at release.
  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build production bundle
        run: pnpm build
