# Packages OpenWaggle with Electrobun on every supported target and proves the package the way a user
# meets it (ADR 0064, docs/release-and-versioning.md "Electrobun packaging"):
#
# - scripts/electrobun/package.ts builds against OpenWaggle's native devkit (electrobun-native.yml),
#   signed with a throwaway self-signed identity generated in the job (never a release secret);
# - the packaged app passes the supported-platform floor;
# - the fresh-install artifact installs (macOS DMG, Windows NSIS installer, Linux AppImage);
# - the installed app launches hidden with its main window on CEF (scripts/electrobun/ci/smoke.ts)
#   and reaches startup status ready. The cold launch also starts the Session Host, runs one turn
#   against a local fake provider through `openwaggle run`, echoes through a terminal and opens a
#   Browser preview; the warm launch opens that Session from an `openwaggle://` link. Both record
#   their start times and idle memory, with screenshots over CDP;
# - a second build one version later, served from a loopback feed, is found, downloaded and
#   installed by the installed app's own updater (Restart to update), and the app then launches as
#   the new version.
# - with `bench-runs`, the installed app is also measured by the shell bench
#   (scripts/bench/electron-bench.ts --shell electrobun), the same way bench-electron.yml measures
#   the Electron app, and its result uploads with the rest. With `electron-ref` too, that Electron
#   build is packaged and benched in the same job, on the same display and session bus, so the two
#   shells' numbers differ only by the shell.
#
# `targets` narrows the matrix while iterating (one entry of the default list, as JSON).
name: Electrobun Package

on:
  workflow_dispatch:
    inputs:
      devkit-run-id:
        description: Run of electrobun-native.yml whose devkits to package against (empty builds them).
        type: string
        default: ""
      targets:
        description: The package matrix, as JSON (default every target).
        type: string
        default: '[{"target":"darwin-arm64","runner":"macos-15","platform":"darwin","arch":"arm64"},{"target":"darwin-x64","runner":"macos-15-intel","platform":"darwin","arch":"x64"},{"target":"linux-x64","runner":"ubuntu-24.04","platform":"linux","arch":"x64"},{"target":"win32-x64","runner":"windows-2025","platform":"win32","arch":"x64"}]'
      bench-runs:
        description: Runs of the shell bench on the installed app (0 skips it).
        type: string
        default: "0"
      electron-ref:
        description: With bench-runs, an Electron-shell commit to package and bench in the same job (empty skips it).
        type: string
        default: ""
  workflow_call:
    inputs:
      devkit-run-id:
        type: string
        default: ""
      targets:
        type: string
        default: '[{"target":"darwin-arm64","runner":"macos-15","platform":"darwin","arch":"arm64"},{"target":"darwin-x64","runner":"macos-15-intel","platform":"darwin","arch":"x64"},{"target":"linux-x64","runner":"ubuntu-24.04","platform":"linux","arch":"x64"},{"target":"win32-x64","runner":"windows-2025","platform":"win32","arch":"x64"}]'
      bench-runs:
        type: string
        default: "0"
      electron-ref:
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: electrobun-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTROBUN_TELEMETRY: "0"
  HUTCH_VERSION: "0.29.0"
  OPENWAGGLE_RELEASE_CHANNEL: beta
  NEXT_VERSION: 1.0.0-beta.900
  FEED_PORT: "8765"

jobs:
  native:
    if: inputs.devkit-run-id == ''
    uses: ./.github/workflows/electrobun-native.yml
    with:
      probes: false

  package:
    name: Package ${{ matrix.target }}
    needs: native
    if: ${{ !cancelled() && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEVKIT: ${{ github.workspace }}/out/electrobun-native/${{ matrix.target }}/devkit
      HUTCH_ELECTROBUN_DEVKIT_ROOT: ${{ github.workspace }}/out/electrobun-native/${{ matrix.target }}/devkit
      OPENWAGGLE_HUTCH: hutch electrobun
      RESULTS: ${{ github.workspace }}/out/electrobun-package-results/${{ matrix.target }}
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: ./.github/actions/install-hutch
        with:
          version: ${{ env.HUTCH_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electrobun-native-${{ matrix.target }}
          path: out
          run-id: ${{ inputs.devkit-run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack the native layer
        run: |
          mkdir -p out/electrobun-native "$RESULTS"
          tar -xzf "out/electrobun-native-${{ matrix.target }}.tgz" -C out/electrobun-native

      - uses: ./.github/actions/bun-install

      - name: Prepare the Electrobun SDK
        run: hutch electrobun prepare

      - name: Linux display and webview runtime
        if: matrix.platform == 'linux'
        run: bash vendor/electrobun/ci/linux-display.sh

      - name: Throwaway macOS signing identity
        if: matrix.platform == 'darwin'
        run: bash scripts/electrobun/ci/macos-throwaway-identity.sh

      - name: Throwaway Windows signing certificate
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./scripts/electrobun/ci/windows-throwaway-identity.ps1

      - name: Packaging tools
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"; mkdir -p "$tools"
          args=(--arch "${{ matrix.arch }}")
          case "${{ matrix.platform }}" in
            win32)
              # vendor/electrobun/build.ts downloaded it and checked Microsoft's Authenticode signature.
              cp out/electrobun-native/win32-x64/webview2/MicrosoftEdgeWebview2Setup.exe "$tools/"
              makensis="/c/Program Files (x86)/NSIS/makensis.exe"
              [ -x "$makensis" ] || choco install nsis -y --no-progress
              args+=(--webview2 "$tools/MicrosoftEdgeWebview2Setup.exe" --makensis "$makensis")
              ;;
            linux)
              curl -fsSL --retry 3 -o "$tools/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
              echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tools/appimagetool" | sha256sum -c -
              chmod +x "$tools/appimagetool"
              args+=(--appimagetool "$tools/appimagetool")
              ;;
          esac
          printf '%s\n' "${args[@]}" > "$RUNNER_TEMP/package-args"

      - name: Build the app
        run: bun run build

      - name: Package the current version
        run: |
          set -euo pipefail
          args=(); while IFS= read -r arg; do args+=("$arg"); done < "$RUNNER_TEMP/package-args"
          start=$(date +%s)
          # The installed app's release directory is the feed's /current; the update comes from its
          # sibling /next, as a GitHub release directory's update comes from the next tag's.
          OPENWAGGLE_ELECTROBUN_RELEASE_BASE_URL="http://127.0.0.1:$FEED_PORT/current" APPIMAGE_EXTRACT_AND_RUN=1 \
            bun scripts/electrobun/package.ts "${args[@]}" | tee "$RESULTS/package-current.txt"
          echo "{\"packageSeconds\": $(( $(date +%s) - start ))}" > "$RESULTS/package-current.json"
          mkdir -p "$RUNNER_TEMP/feed"
          cp -R out/electrobun/release "$RUNNER_TEMP/feed/current"
          ls -la "$RUNNER_TEMP/feed/current" | tee "$RESULTS/release-current.txt"
          cat "$RUNNER_TEMP/feed/current/"*-update*.json | tee -a "$RESULTS/release-current.txt"

      - name: Check the package against the platform floor
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = darwin ]; then
            app=$(find out/electrobun/inner -mindepth 2 -maxdepth 2 -name '*.app' | head -1)
          else
            app=$(find out/electrobun/build -mindepth 2 -maxdepth 2 -type d | head -1)
          fi
          bun scripts/check-native-platform-floor.ts --platform ${{ matrix.platform }} "$app" | tee "$RESULTS/floor.txt"

      - name: Install
        run: |
          set -euo pipefail
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "PROFILE=$RUNNER_TEMP/profile" >> "$GITHUB_ENV"
          bun scripts/electrobun/ci/smoke.ts install "$RUNNER_TEMP/feed/current" | tee "$RESULTS/install.json"
          launcher=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).launcher" "$RESULTS/install.json")
          echo "LAUNCHER=$launcher" >> "$GITHUB_ENV"

      # A user whose desktop portal is activatable but never answers (a session without a working
      # xdg-desktop-portal) must still get a window: every Linux launch below runs on a session bus
      # whose org.freedesktop.portal.Desktop starts and never replies, and the cold launch fails if
      # its window takes more than 10 s (it waited D-Bus's 25 s for the portal's Secret interface).
      - name: A desktop portal that never answers
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          services="$HOME/.local/share/dbus-1/services"
          mkdir -p "$services"
          printf '[D-BUS Service]\nName=org.freedesktop.portal.Desktop\nExec=/usr/bin/sleep infinity\n' \
            > "$services/org.freedesktop.portal.Desktop.service"
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

      # On macOS and Linux the launcher chooses CEF's DevTools port, as in a user's launch, and the
      # app's own preview screenshot goes through it: the preview's CDP works without a QA port.
      - name: Cold launch (Session Host, fake-provider Run, terminal, Browser preview)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          port=(); if [ "$PLATFORM" != win32 ]; then port=(--launcher-cdp-port); fi
          bun scripts/electrobun/ci/smoke.ts launch "$LAUNCHER" --expect "$VERSION" --profile "$PROFILE" --prove \
            "${port[@]}" --out "$RESULTS/launch-cold.json" --screenshots "$RESULTS/screenshots/cold"
          if [ "$PLATFORM" = linux ]; then
            node -e '
              const ms = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).spawnToRendererMs
              if (!(ms < 10000)) { console.error(`The window took ${ms} ms with an unanswering portal.`); process.exit(1) }' \
              "$RESULTS/launch-cold.json"
          fi

      - name: Warm launch (open the Session from its openwaggle link)
        run: |
          session=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).proof.run.sessionId" "$RESULTS/launch-cold.json")
          bun scripts/electrobun/ci/smoke.ts launch "$LAUNCHER" --expect "$VERSION" --profile "$PROFILE" --open-session "$session" \
            --out "$RESULTS/launch-warm.json" --screenshots "$RESULTS/screenshots/warm"

      - name: Bench the installed app (shell bench, medians of the runs)
        if: inputs.bench-runs != '0'
        env:
          BENCH_RUNS: ${{ inputs.bench-runs }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bun scripts/bench/electron-bench.ts install --shell electrobun --dist "$RUNNER_TEMP/feed/current" \
            --launcher "$LAUNCHER" --out "$RESULTS/bench-install.json"
          bun scripts/bench/electron-bench.ts measure --shell electrobun --install "$RESULTS/bench-install.json" \
            --runs "$BENCH_RUNS" --work "$RUNNER_TEMP/bench" \
            --label "electrobun @ ${GITHUB_SHA::9}" --out "$RESULTS/bench-result.json" \
            --screenshots "$RESULTS/screenshots/bench" --logs "$RESULTS/bench-logs"
          {
            echo "## $TARGET"
            bun scripts/bench/electron-bench.ts summarize "$RESULTS/bench-result.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check out the Electron build to compare
        if: inputs.bench-runs != '0' && inputs.electron-ref != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.electron-ref }}
          path: electron-app
          persist-credentials: false

      # bench-electron.yml's build of the Electron app, measured by the same bench as the app above.
      - name: Bench the Electron build in the same session
        if: inputs.bench-runs != '0' && inputs.electron-ref != ''
        env:
          BENCH_RUNS: ${{ inputs.bench-runs }}
          ELECTRON_REF: ${{ inputs.electron-ref }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            darwin) flags=(--mac "--$ARCH") ;;
            linux) flags=(--linux); sudo apt-get install -y -q libfuse2t64 ;;
            win32) flags=(--win) ;;
          esac
          (
            cd electron-app
            bun install --frozen-lockfile --cpu=arm64 --cpu=x64
            node node_modules/electron/install.js
            bun run build
            bunx electron-builder "${flags[@]}" --publish never
          ) > "$RESULTS/electron-package.txt" 2>&1
          bun scripts/bench/electron-bench.ts install --shell electron --dist electron-app/dist \
            --dir "$RUNNER_TEMP/electron-install" --out "$RESULTS/electron-install.json"
          bun scripts/bench/electron-bench.ts measure --shell electron --install "$RESULTS/electron-install.json" \
            --runs "$BENCH_RUNS" --work "$RUNNER_TEMP/electron-bench" --label "electron @ ${ELECTRON_REF::9}" \
            --out "$RESULTS/electron-result.json" --screenshots "$RESULTS/screenshots/electron" \
            --logs "$RESULTS/electron-logs"
          {
            echo "## $TARGET, both shells"
            bun scripts/bench/electron-bench.ts summarize "$RESULTS/bench-result.json" "$RESULTS/electron-result.json"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package the next version against the current one
        run: |
          set -euo pipefail
          nohup bun scripts/electrobun/ci/smoke.ts serve "$RUNNER_TEMP/feed" "$FEED_PORT" > "$RUNNER_TEMP/feed.log" 2>&1 &
          sleep 2
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.NEXT_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          # The main and renderer builds carry the version, so the next release builds them again.
          bun run build
          args=(); while IFS= read -r arg; do args+=("$arg"); done < "$RUNNER_TEMP/package-args"
          if ! OPENWAGGLE_ELECTROBUN_PATCH_BASE_URL="http://127.0.0.1:$FEED_PORT/current" APPIMAGE_EXTRACT_AND_RUN=1 \
            bun scripts/electrobun/package.ts "${args[@]}" 2>&1 | tee "$RESULTS/package-next.txt"; then
            echo "::warning::Packaging with a delta patch against the current version failed; packaging without one."
            APPIMAGE_EXTRACT_AND_RUN=1 bun scripts/electrobun/package.ts "${args[@]}" 2>&1 | tee -a "$RESULTS/package-next.txt"
          fi
          cp -R out/electrobun/release "$RUNNER_TEMP/feed/next"
          ls -la "$RUNNER_TEMP/feed/next" | tee "$RESULTS/release-next.txt"
          cat "$RUNNER_TEMP/feed/next/"*-update*.json | tee -a "$RESULTS/release-next.txt"
          git checkout -- package.json

      - name: Update the installed app through its updater
        run: |
          bun scripts/electrobun/ci/smoke.ts update "$LAUNCHER" --from "$VERSION" --expect "$NEXT_VERSION" \
            --feed "http://127.0.0.1:$FEED_PORT/next/" --profile "$PROFILE" \
            --out "$RESULTS/update.json" --timeout 420 --screenshots "$RESULTS/screenshots/updated"

      - name: Sizes
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          bun -e '
            const fs = require("fs"); const path = require("path")
            const dir = process.argv[1]; const out = {}
            for (const name of fs.readdirSync(dir)) out[name] = fs.statSync(path.join(dir, name)).size
            fs.writeFileSync(process.argv[2], JSON.stringify(out, null, 2))
            console.log(out)' "$RUNNER_TEMP/feed/current" "$RESULTS/release-sizes.json" || true
          # The 30 largest files and directories of the installed app, in KiB.
          root=$(bun -e 'import { installedApp } from "./scripts/electrobun/ci/installed-app"; console.log(installedApp(process.argv[1]).installRoot)' "$LAUNCHER" || true)
          [ -n "$root" ] && du -ak "$root" | sort -rn | head -30 | tee "$RESULTS/installed-top.txt" || true
          # Every file of the installed app: size in bytes, path, and a symbolic link's target.
          [ -n "$root" ] && bun -e '
            const fs = require("fs"); const path = require("path"); const root = process.argv[1]
            const lines = []
            const walk = (dir) => { for (const name of fs.readdirSync(dir).sort()) {
              const file = path.join(dir, name); const stat = fs.lstatSync(file); const rel = path.relative(root, file)
              if (stat.isSymbolicLink()) lines.push(`link ${rel} -> ${fs.readlinkSync(file)}`)
              else if (stat.isDirectory()) walk(file)
              else lines.push(`${stat.size} ${rel}`)
            } }
            walk(root); fs.writeFileSync(process.argv[2], lines.join("\n") + "\n")' "$root" "$RESULTS/installed-files.txt" || true

      - name: Collect logs
        if: ${{ !cancelled() }}
        run: |
          for file in "${LOCALAPPDATA:-}/openwaggle-updater/electrobun-transition.log" \
            "$HOME/.local/share/openwaggle-transition.log" "$RUNNER_TEMP/feed.log"; do
            [ -f "$file" ] && cp "$file" "$RESULTS/" || true
          done
          [ -d "$PROFILE/logs" ] && cp -R "$PROFILE/logs" "$RESULTS/app-logs" || true
          # Electrobun's update plans and results, under the directory its updater manages.
          mkdir -p "$RESULTS/updater"
          for root in "$HOME/Library/Application Support/com.openwaggle.app" \
            "$HOME/.local/share/com.openwaggle.app" "${LOCALAPPDATA:-}/com.openwaggle.app"; do
            [ -d "$root" ] && find "$root" -maxdepth 3 -name '*.json' -size -64k \
              -exec cp {} "$RESULTS/updater/" \; || true
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: electrobun-package-${{ matrix.target }}
          path: out/electrobun-package-results/${{ matrix.target }}
          retention-days: 14
