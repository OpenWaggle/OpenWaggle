name: Windows Terminal Diagnostics

# A manual Windows lane that keeps ConPTY investigations apart from ordinary PR feedback. CI has
# no Windows app E2E (ADR 0033); nightly.yml smokes the packaged Windows app. Terminals run on
# ConPTY through bun:ffi (src/main/adapters/terminal/bun-pty/), so the terminal integration
# tests on a Windows runner are the backend's proof.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact commit SHA on the selected branch.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-terminal-diagnostics-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  terminal-backend:
    name: Terminal backend (ConPTY)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Verify dispatched commit identity
        shell: pwsh
        env:
          DISPATCHED_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          if ($env:EXPECTED_SHA -cnotmatch '^[0-9a-f]{40}$') { exit 1 }
          if ($env:DISPATCHED_SHA -cne $env:EXPECTED_SHA) { exit 1 }

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - uses: ./.github/actions/bun-install

      - name: Run the terminal backend integration tests
        shell: pwsh
        run: |
          bun --bun vitest run -c vitest.integration.config.ts src/main/adapters/terminal 2>&1 | Tee-Object -FilePath terminal-diagnostics.log
          exit $LASTEXITCODE

      - name: Upload terminal diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: terminal-backend-windows
          path: terminal-diagnostics.log
          if-no-files-found: ignore
          retention-days: 7
