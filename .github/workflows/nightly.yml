# Nightly cross-platform packaged-app canary, the unit tier in a zone west of UTC, and the
# coverage-uniqueness index the per-PR advisory reads.
#
# E2E was removed from CI (ADR 0033): per-PR gating relies on unit + integration
# + MCP conformance, mirroring pingdotgg/t3code. This scheduled canary is the
# compensating control for the one thing unit/integration cannot cover - that the
# real packaged Electrobun app builds and its native runtime (sqlite, sharp)
# loads on each OS. It is non-gating: it never blocks a merge, it surfaces
# packaging/native regressions between releases as a signal.
#
# Scope note: this builds OpenWaggle's Electrobun native layer (electrobun-native.yml), packages the
# app against it the way release.yml does (scripts/electrobun/package.ts), and runs the native
# platform-floor guard (scripts/check-native-platform-floor.ts) and `packaged-app:smoke` (app
# directory shape, packaged docs, and a native load probe run by the app's bundled Bun). The
# install canary (electrobun-package.yml) then installs, launches and updates a package on every
# OS, the Windows NSIS installer included. Neither covers renderer boot, CSP, visual pixels, or
# timing budgets - those are local/manual only after E2E removal.
name: Nightly

on:
  schedule:
    # 04:17 UTC daily (off the top of the hour; GitHub delays on-the-hour crons).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # The Hutch release the other Electrobun workflows pin.
  HUTCH_VERSION: "0.29.0"

jobs:
  # Every Vitest config pins the tests to Pacific/Kiritimati (UTC+14), so every pre-push and CI
  # run sees local and UTC days disagree (scripts/test-support/vitest-tier-options.ts). This runs
  # the unit tier on the other side of UTC, where a local-date mistake shows differently, and
  # through a DST zone.
  unit-west-of-utc:
    name: Unit tests at America/Adak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENWAGGLE_TEST_TIME_ZONE: America/Adak
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Unit tests
        run: bun run test:unit

  native:
    name: Electrobun native layer
    uses: ./.github/workflows/electrobun-native.yml
    with:
      probes: false

  packaged-canary:
    name: Packaged canary ${{ matrix.label }}
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-15
            target: darwin-arm64
            syntax_budget: true
          - label: Linux
            # Matches the release build: Ubuntu 22.04 keeps native modules on glibc 2.35.
            runner: ubuntu-22.04
            target: linux-x64
            syntax_budget: false
          - label: Windows
            runner: windows-2025
            target: win32-x64
            syntax_budget: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Package a real release identity (icons, appId, productName) rather than the
      # dev fallback, so the canary exercises the same packaging path releases use.
      OPENWAGGLE_RELEASE_CHANNEL: stable
      ELECTROBUN_TELEMETRY: "0"
      OPENWAGGLE_HUTCH: hutch electrobun
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Setup Hutch
        uses: ./.github/actions/install-hutch
        with:
          version: ${{ env.HUTCH_VERSION }}

      # OpenWaggle's Electrobun native layer for this target, built and floor-checked by the
      # native job; Hutch packages against it instead of its own download.
      - name: Download the Electrobun native layer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electrobun-native-${{ matrix.target }}
          path: out

      - name: Unpack the Electrobun native layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/electrobun-native
          tar -xzf "out/electrobun-native-${{ matrix.target }}.tgz" -C out/electrobun-native
          echo "HUTCH_ELECTROBUN_DEVKIT_ROOT=$GITHUB_WORKSPACE/out/electrobun-native/${{ matrix.target }}/devkit" >> "$GITHUB_ENV"

      - name: Install dependencies
        id: install
        uses: ./.github/actions/bun-install

      - name: Build production bundle
        run: bun run build

      # Unsigned: macOS signs ad hoc and Windows skips Authenticode without a certificate.
      - name: Package the app
        shell: bash
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          set -euo pipefail
          args=()
          case "${{ matrix.target }}" in
            win32-x64)
              makensis="/c/Program Files (x86)/NSIS/makensis.exe"
              [ -x "$makensis" ] || choco install nsis -y --no-progress
              args+=(--webview2 "$GITHUB_WORKSPACE/out/electrobun-native/win32-x64/webview2/MicrosoftEdgeWebview2Setup.exe" --makensis "$makensis")
              ;;
            linux-x64)
              sudo apt-get install -y -q libfuse2 zstd
              curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
              echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
              chmod +x "$RUNNER_TEMP/appimagetool"
              args+=(--appimagetool "$RUNNER_TEMP/appimagetool")
              ;;
          esac
          bun scripts/electrobun/package.ts "${args[@]}"

      - name: Check native platform floor
        run: bun scripts/check-native-platform-floor.ts

      - name: Smoke packaged runtime
        run: bun run packaged-app:smoke

      # The syntax performance budget previously ran only in the deleted macOS E2E
      # job. Kept alive here on the macOS canary as a non-gating regression signal.
      # It runs after packaging and the packaged smoke, so a budget failure never
      # skips that coverage. On the shared runner a single slow run is often a
      # scheduling outlier (it has failed on unchanged main), so a failure is rerun
      # once and only a second failure fails the job: a sustained regression fails
      # both runs. It needs only the installed dependencies, so it still reports when
      # packaging or the smoke failed, and is skipped when the install itself failed.
      - name: Check syntax performance budgets
        if: ${{ !cancelled() && matrix.syntax_budget && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          if bun run benchmark:syntax; then
            exit 0
          fi
          echo "::warning::Syntax benchmark failed or exceeded its budget once; rerunning to tell a shared-runner outlier from a sustained regression."
          bun run benchmark:syntax
        env:
          SYNTAX_BENCHMARK_PROFILE: performance/syntax-budgets/macos-arm64-github-hosted.json

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-${{ matrix.label }}-release
          path: |
            out/electrobun/release/*.json
            out/electrobun/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Installs every OS's fresh-install artifact the way a user does (the macOS DMG, the Windows NSIS
  # installer, the Linux AppImage), launches it cold and warm, and updates it to a newer build through
  # the update engine, against the devkits the native job built.
  install-canary:
    name: Install canary
    needs: native
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/electrobun-package.yml
    with:
      devkit-run-id: ${{ github.run_id }}

  # Coverage uniqueness: every tier test file alone under v8 coverage, in four shards, folded into the index
  # the check runner's advisory `coverage-uniqueness` step compares a PR's new test files with
  # (scripts/coverage-uniqueness.ts). Advisory like the rest of this workflow: it gates nothing.
  coverage-uniqueness-shard:
    name: Coverage uniqueness shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Build native modules for Node
        run: bun run prepare:native:node

      - name: Measure each test file's coverage
        run: bun scripts/coverage-uniqueness.ts index --shard ${{ matrix.shard }}/4 --concurrency 4 --out .tmp/coverage-uniqueness/shard-${{ matrix.shard }}.json

      - name: Upload the shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-uniqueness-shard-${{ matrix.shard }}
          path: .tmp/coverage-uniqueness/shard-${{ matrix.shard }}.json
          retention-days: 1

  coverage-uniqueness-index:
    name: Coverage uniqueness index
    needs: coverage-uniqueness-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      # The merge imports the repository's shared schema code, which needs effect installed.
      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Download the shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-uniqueness-shard-*
          path: .tmp/coverage-uniqueness/shards
          merge-multiple: true

      - name: Merge the shards
        run: bun scripts/coverage-uniqueness.ts merge --out .tmp/coverage-uniqueness/index.json .tmp/coverage-uniqueness/shards/*.json

      - name: Upload the index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # scripts/coverage-uniqueness.ts downloads the newest artifact of this name.
          name: coverage-uniqueness-index
          path: .tmp/coverage-uniqueness/index.json
          retention-days: 14
