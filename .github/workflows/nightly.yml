# Nightly cross-platform packaged-app canary, the unit tier in a zone west of UTC, and the
# coverage-uniqueness index the per-PR advisory reads.
#
# E2E was removed from CI (ADR 0033): per-PR gating relies on unit + integration
# + MCP conformance, mirroring pingdotgg/t3code. This scheduled canary is the
# compensating control for the one thing unit/integration cannot cover - that the
# real packaged Electron app builds and its native runtime (sqlite, sharp)
# loads on each OS. It is non-gating: it never blocks a merge, it surfaces
# packaging/native regressions between releases as a signal.
#
# Scope note: this builds + packages + runs the native platform-floor guard
# (scripts/check-native-platform-floor.ts) and `packaged-app:smoke` (asar shape,
# packaged docs, and a native sqlite load probe via ELECTRON_RUN_AS_NODE).
# It also starts the packaged app hidden and checks that its Session Host starts and
# answers the CLI (scripts/qa/packaged-session-host-startup-smoke.ts). It shows no
# window, so it does not cover renderer boot, CSP, visual pixels, or timing budgets -
# those are local/manual only after E2E removal. The development app (`bun run dev`) gets the
# same Session Host check (scripts/qa/dev-app-startup-smoke.ts).
name: Nightly

on:
  schedule:
    # 04:17 UTC daily (off the top of the hour; GitHub delays on-the-hour crons).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Every Vitest config pins the tests to Pacific/Kiritimati (UTC+14), so every pre-push and CI
  # run sees local and UTC days disagree (scripts/test-support/vitest-tier-options.ts). This runs
  # the unit tier on the other side of UTC, where a local-date mistake shows differently, and
  # through a DST zone.
  unit-west-of-utc:
    name: Unit tests at America/Adak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENWAGGLE_TEST_TIME_ZONE: America/Adak
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Unit tests
        run: bun run test:unit

  packaged-canary:
    name: Packaged canary ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            runner: macos-latest
            build_flags: --mac --arm64 --x64 --publish never
            syntax_budget: true
            packaged_executable: dist/mac-arm64/OpenWaggle.app/Contents/MacOS/OpenWaggle
            display: ""
          - label: Linux
            # Matches the release build: Ubuntu 22.04 keeps native modules on glibc 2.35.
            runner: ubuntu-22.04
            build_flags: --linux --publish never
            syntax_budget: false
            packaged_executable: dist/linux-unpacked/openwaggle
            display: xvfb-run -a
          - label: Windows
            runner: windows-latest
            build_flags: --win --publish never
            syntax_budget: false
            packaged_executable: dist/win-unpacked/OpenWaggle.exe
            display: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Package a real release identity (icons, appId, productName) rather than the
      # dev fallback, so the canary exercises the same packaging path releases use.
      OPENWAGGLE_RELEASE_CHANNEL: stable
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install dependencies
        id: install
        uses: ./.github/actions/bun-install

      - name: Build production bundle
        run: bun run build

      - name: Package installers
        run: bunx electron-builder ${{ matrix.build_flags }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check native platform floor
        run: bun scripts/check-native-platform-floor.ts

      - name: Smoke packaged runtime
        run: bun run packaged-app:smoke

      # Starts the packaged app hidden, waits for its detached Session Host and drives it
      # through the CLI, on a fresh profile and on a migrated one. This is the path a
      # security product broke on Windows in issue #446: the hidden Host launch and the
      # user-only permissions both run Windows PowerShell helpers.
      - name: Smoke packaged Session Host startup
        shell: bash
        run: ${{ matrix.display }} bun run qa:packaged-session-host-startup "${{ matrix.packaged_executable }}"

      - name: Verify Windows installer
        if: matrix.label == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installerPath = Join-Path $PWD "dist/openwaggle-$version-x64.exe"
          bun scripts/verify-windows-installer.ts "$installerPath"

      # The syntax performance budget previously ran only in the deleted macOS E2E
      # job. Kept alive here on the macOS canary as a non-gating regression signal.
      # It runs after packaging and the packaged smoke, so a budget failure never
      # skips that coverage. On the shared runner a single slow run is often a
      # scheduling outlier (it has failed on unchanged main), so a failure is rerun
      # once and only a second failure fails the job: a sustained regression fails
      # both runs. It needs only the installed dependencies, so it still reports when
      # packaging or the smoke failed, and is skipped when the install itself failed.
      - name: Check syntax performance budgets
        if: ${{ !cancelled() && matrix.syntax_budget && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          if bun run benchmark:syntax; then
            exit 0
          fi
          echo "::warning::Syntax benchmark failed or exceeded its budget once; rerunning to tell a shared-runner outlier from a sustained regression."
          bun run benchmark:syntax
        env:
          SYNTAX_BENCHMARK_PROFILE: performance/syntax-budgets/macos-arm64-github-hosted.json

      # Starts the development app with `bun run dev`, hidden, as a contributor would (through
      # Bun's shell on Windows), and checks that its Session Host starts and answers the CLI. It
      # needs only the installed dependencies, so it still reports when packaging failed, and it
      # runs after the syntax budget so its build does not load the runner during that timing.
      - name: Smoke development app startup
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: ${{ matrix.display }} bun run qa:dev-app-startup

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-${{ matrix.label }}-dist
          path: |
            dist/*.yml
            dist/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Coverage uniqueness: every tier test file alone under v8 coverage, in four shards, folded into the index
  # the check runner's advisory `coverage-uniqueness` step compares a PR's new test files with
  # (scripts/coverage-uniqueness.ts). Advisory like the rest of this workflow: it gates nothing.
  coverage-uniqueness-shard:
    name: Coverage uniqueness shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install dependencies
        uses: ./.github/actions/bun-install
        with:
          electron-binary: 'true'

      - name: Build native modules for Node
        run: bun run prepare:native:node

      - name: Measure each test file's coverage
        run: bun scripts/coverage-uniqueness.ts index --shard ${{ matrix.shard }}/4 --concurrency 4 --out .tmp/coverage-uniqueness/shard-${{ matrix.shard }}.json

      - name: Upload the shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-uniqueness-shard-${{ matrix.shard }}
          path: .tmp/coverage-uniqueness/shard-${{ matrix.shard }}.json
          retention-days: 1

  coverage-uniqueness-index:
    name: Coverage uniqueness index
    needs: coverage-uniqueness-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      # The merge imports the repository's shared schema code, which needs effect installed.
      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Download the shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-uniqueness-shard-*
          path: .tmp/coverage-uniqueness/shards
          merge-multiple: true

      - name: Merge the shards
        run: bun scripts/coverage-uniqueness.ts merge --out .tmp/coverage-uniqueness/index.json .tmp/coverage-uniqueness/shards/*.json

      - name: Upload the index
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # scripts/coverage-uniqueness.ts downloads the newest artifact of this name.
          name: coverage-uniqueness-index
          path: .tmp/coverage-uniqueness/index.json
          retention-days: 14
