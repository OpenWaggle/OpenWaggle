# Mirrors pingdotgg/t3code .github/workflows/release.yml: releases are decoupled
# from feature merges. A feature just lands on main (CI runs once); a release is
# a deliberate event driven by a pushed tag (stable), a scheduled nightly, or a
# manual dispatch. The heavy cross-platform build runs ONLY here, never per PR.
#
# Adapted to OpenWaggle: pnpm + electron-builder instead of t3code's Vite+/
# blacksmith infra, and WITHOUT code signing/notarization (t3code's Azure
# Trusted Signing + Apple notarization steps are intentionally omitted) and
# without their CLI/relay/AUR/web-deploy/Discord jobs, which OpenWaggle has not.
# The non-standard `queue: max` concurrency field t3code uses is also omitted:
# GitHub Actions only supports `group` + `cancel-in-progress`.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
  schedule:
    # Off minute zero: GitHub delays scheduled runs most at the top of the hour.
    - cron: "38 */3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string

# Serialize nightlies so overlapping runs cannot build the same commit twice.
# Stable tag releases get their own group so a nightly never blocks them.
# Running publishers are never canceled.
concurrency:
  group: release-${{ (github.event_name == 'schedule' || github.event.inputs.channel == 'nightly') && 'nightly' || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check_changes:
    name: Check for changes since last nightly
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        name: Compare HEAD to last nightly tag
        run: |
          last_nightly_tag=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n 1)
          if [[ -z "$last_nightly_tag" ]]; then
            echo "No previous nightly tag found. Proceeding with release."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_nightly_sha=$(git rev-parse "$last_nightly_tag^{commit}")
          head_sha=$(git rev-parse HEAD)

          if [[ "$last_nightly_sha" == "$head_sha" ]]; then
            echo "No changes on main since last nightly release ($last_nightly_tag). Skipping."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected on main since $last_nightly_tag. Proceeding."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Preflight
    needs: [check_changes]
    if: |
      !failure() && !cancelled() &&
      (github.event_name != 'schedule' || needs.check_changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-stable}" == "nightly" ) ]]; then
            # Nightly version: <base>-nightly.<date>.<run>+<shortsha>, base from package.json.
            base="$(node -p "require('./package.json').version.split('-')[0]")"
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"
            short_sha="${NIGHTLY_SHA:0:7}"
            version="${base}-nightly.${nightly_date}.${NIGHTLY_RUN_NUMBER}"
            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=OpenWaggle v$version ($short_sha)" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              raw="${DISPATCH_VERSION}"
              if [[ -z "$raw" ]]; then
                echo "workflow_dispatch stable releases require the version input." >&2
                exit 1
              fi
            else
              raw="${GITHUB_REF_NAME}"
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=OpenWaggle v$version" >> "$GITHUB_OUTPUT"
            # A bare X.Y.Z is a full release; anything with a pre-release suffix
            # (e.g. alpha/beta/rc) is a prerelease and not marked latest.
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  quality:
    name: Release quality checks
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Install terminal integration shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test:unit && pnpm test:integration && pnpm test:component

  build:
    name: Build ${{ matrix.label }}
    needs: [preflight, quality]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.quality.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64 + x64)
            runner: macos-latest
            platform: macos
            build_flags: --mac --arm64 --x64 --publish never
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            build_flags: --linux --publish never
          - label: Windows x64
            runner: windows-latest
            platform: windows
            build_flags: --win --publish never
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Align package version to release version
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${{ needs.preflight.outputs.version }}"

      - name: Stamp release build channel
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.preflight.outputs.version }}'
          case "$version" in
            *-nightly.*) channel=nightly ;;
            *-alpha.*) channel=alpha ;;
            *-beta.*) channel=beta ;;
            *-rc.*) channel=rc ;;
            *-*) echo "Unrecognized prerelease id in $version" >&2; exit 1 ;;
            *) channel=stable ;;
          esac
          echo "OPENWAGGLE_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Build production bundle
        run: pnpm build

      - name: Package installers
        run: pnpm exec electron-builder ${{ matrix.build_flags }}
        env:
          # We do not sign or notarize; keep electron-builder from trying to
          # discover a macOS signing identity (t3code's Azure/Apple signing
          # steps are intentionally omitted).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Smoke packaged PTY runtime
        run: pnpm packaged-app:smoke

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.exe
            dist/*.yml
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [preflight, build]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ${{ needs.preflight.outputs.release_name }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          draft: false
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
          token: ${{ github.token }}

  finalize:
    name: Finalize release
    needs: [preflight, release]
    # Stable only: after a tagged stable release, bump main's package version so
    # the next development cycle starts from the released version. Nightlies
    # never touch main. Mirrors t3code's finalize job, but pushes with the
    # built-in GITHUB_TOKEN instead of a GitHub App (no App/secret needed on a
    # personal repo). The push requires a ruleset bypass for the
    # `github-actions` app on main; add it once with:
    #   gh api -X PUT repos/OpenWaggle/OpenWaggle/rulesets/<id> ...  (see PR notes)
    # Until that bypass exists the push is blocked, so the step tolerates a
    # failed push and records a notice rather than failing the whole release.
    if: ${{ !failure() && !cancelled() && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0

      - name: Update version string
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION"

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "No version changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(release): prepare $RELEASE_TAG"
          if git push origin HEAD:main; then
            echo "Bumped main to $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Version bump push was blocked (add a github-actions ruleset bypass on main to enable it)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarize release
        run: |
          {
            echo "## Released ${{ needs.preflight.outputs.tag }}"
            echo ""
            echo "- Channel: ${{ needs.preflight.outputs.release_channel }}"
            echo "- Prerelease: ${{ needs.preflight.outputs.is_prerelease }}"
            echo "- Latest: ${{ needs.preflight.outputs.make_latest }}"
          } >> "$GITHUB_STEP_SUMMARY"
