name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_version:
        description: Exact forward semver to prepare through the protected release PR
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ELECTROBUN_TELEMETRY: "0"
  HUTCH_VERSION: "0.29.0"

concurrency:
  group: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') && format('release-{0}', github.sha) || 'release-prepare' }}"
  cancel-in-progress: false

permissions:
  contents: read

# No job here restores Bun's package cache: Bun does not check cached package files against the
# integrity in bun.lock, and these jobs sign, notarize and publish what they install
# (.github/actions/bun-install).
jobs:
  version:
    name: Prepare or Publish Protected Version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      new_tag: ${{ steps.release.outputs.new_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Validate manual release dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$RELEASE_TARGET_VERSION"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Determine bump from conventional commits
        if: "github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')"
        id: bump
        run: |
          set -euo pipefail
          if LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null); then
            RANGE="${LAST_TAG}..HEAD"
          else
            LAST_TAG=""
            RANGE="HEAD"
          fi

          echo "Last tag: ${LAST_TAG:-none}"
          echo "Commit range: ${RANGE}"
          COMMITS=$(git log --format='%s' "$RANGE")
          BODIES=$(git log --format='%b' "$RANGE")
          HAS_BREAKING=false
          HAS_FEAT=false
          HAS_FIX=false

          while IFS= read -r message; do
            [ -z "$message" ] && continue
            if grep -qiE '^[a-z]+(\(.+\))?!:' <<<"$message"; then
              HAS_BREAKING=true
            fi
            if grep -qE '^feat(\(.+\))?:' <<<"$message"; then
              HAS_FEAT=true
            fi
            if grep -qE '^fix(\(.+\))?:' <<<"$message"; then
              HAS_FIX=true
            fi
          done <<<"$COMMITS"

          if grep -q 'BREAKING CHANGE' <<<"$BODIES"; then
            HAS_BREAKING=true
          fi

          if [ "$HAS_BREAKING" = true ]; then
            BUMP="major"
          elif [ "$HAS_FEAT" = true ]; then
            BUMP="minor"
          elif [ "$HAS_FIX" = true ]; then
            BUMP="patch"
          else
            echo "No feat: or fix: commits since last release; skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(node -p "require('./package.json').version")
          # Bash regexes instead of GNU sed alternation, so the release harness runs this step on
          # macOS too (scripts/__tests__/app-release-train.test-harness.ts).
          if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta|rc)\.([0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            PRERELEASE_TAG="${BASH_REMATCH[2]}"
            PRERELEASE_NUM="${BASH_REMATCH[3]}"
            NEW_VERSION="${BASE_VERSION}-${PRERELEASE_TAG}.$((PRERELEASE_NUM + 1))"
          elif [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<<"$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          else
            echo "Unrecognized desktop app version ${CURRENT}." >&2
            exit 1
          fi

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Prepare release PR or publish its protected merge
        id: release
        env:
          BUMP_SHOULD_RELEASE: ${{ steps.bump.outputs.should_release }}
          BUMP_VERSION: ${{ steps.bump.outputs.new_version }}
          RELEASE_TARGET_VERSION: ${{ inputs.target_version }}
          GH_TOKEN: ${{ github.token }}
          MACOS_SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          MACOS_NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail

          HEAD_SUBJECT=$(git show -s --format=%s HEAD)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          RELEASE_SUBJECT_VERSION=$(bun scripts/app-release-state.ts release-subject-version \
            --subject "$HEAD_SUBJECT" 2>/dev/null || true)

          write_no_release_output() {
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          }

          # A maintainer closing the release PR mid-validation is a deliberate "not this
          # version", not a workflow failure: report it and end without preparing a release.
          exit_if_release_pr_closed() {
            if [ "$1" = "CLOSED" ]; then
              echo "::notice::Release PR ${PR_URL} was closed during validation; nothing to prepare."
              write_no_release_output
              exit 0
            fi
          }

          if [ -n "$RELEASE_TARGET_VERSION" ]; then
            bun scripts/app-release-state.ts validate-transition \
              --current "$CURRENT_VERSION" \
              --target "$RELEASE_TARGET_VERSION"
            VERSION="$RELEASE_TARGET_VERSION"
          elif [ "$RELEASE_SUBJECT_VERSION" = "$CURRENT_VERSION" ]; then
            VERSION="$CURRENT_VERSION"
          elif [[ "$HEAD_SUBJECT" == "chore(release):"* ]]; then
            write_no_release_output
            exit 0
          elif [ "$BUMP_SHOULD_RELEASE" = "true" ]; then
            VERSION="$BUMP_VERSION"
          else
            write_no_release_output
            exit 0
          fi

          # The promotion guard compares Stable with the newest RC that has a published GitHub
          # release, not the newest rc tag: the tag is pushed before the builds run, so a tag can
          # exist for a build that never shipped. A failed release list read fails the step.
          verify_promotion() {
            local candidate_ref="$1"
            local releases_path="$RUNNER_TEMP/app-releases.jsonl"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | {tag_name, draft}' > "$releases_path"
            bun scripts/app-release-state.ts verify-promotion \
              --target "$VERSION" \
              --candidate "$candidate_ref" \
              --releases "$releases_path"
          }

          # Stable gates run before any branch, PR, or tag exists. A Stable release publishes its
          # hand-written CHANGELOG.md entry: an ordinary merge without one waits with a notice,
          # while a dispatch or a merged release commit fails. The promotion guard requires an RC
          # before a new major and RC-identical content after one.
          if [[ "$VERSION" != *-* ]]; then
            if ! bun scripts/app-release-notes.ts check --version "$VERSION"; then
              if [ -z "$RELEASE_TARGET_VERSION" ] && [ "$RELEASE_SUBJECT_VERSION" != "$VERSION" ]; then
                echo "::notice::Stable ${VERSION} waits for its CHANGELOG.md entry; no release PR was prepared."
                write_no_release_output
                exit 0
              fi
              exit 1
            fi
            verify_promotion HEAD
          fi

          # RC and Stable macOS builds must be signed and notarized. Check the secrets before any
          # branch, PR, or tag exists: build-macos runs after the tag push, so failing there would
          # leave a tag without a release. build-macos checks again before it builds.
          if [[ "$VERSION" == *-rc.* || "$VERSION" != *-* ]]; then
            if [ "$MACOS_SIGNING_CONFIGURED" != "true" ] || [ "$MACOS_NOTARIZATION_CONFIGURED" != "true" ]; then
              echo "::error::${VERSION} needs signed and notarized macOS builds; configure the macOS signing secrets before releasing it." >&2
              exit 1
            fi
          fi

          RELEASE_BRANCH="app-release-v${VERSION}"
          TAG="v${VERSION}"

          verify_version_only_tree() {
            local base_ref="$1"
            local candidate_ref="$2"
            test "$(git diff --name-only "${base_ref}...${candidate_ref}")" = "package.json"
            git show "${base_ref}:package.json" > "$RUNNER_TEMP/base-package.json"
            git show "${candidate_ref}:package.json" > "$RUNNER_TEMP/candidate-package.json"
            bun scripts/app-release-state.ts expected-manifest \
              --base "$RUNNER_TEMP/base-package.json" \
              --output "$RUNNER_TEMP/expected-package.json" \
              --version "$VERSION"
            cmp "$RUNNER_TEMP/expected-package.json" "$RUNNER_TEMP/candidate-package.json"
          }

          verify_release_branch_base() {
            local base_ref="$1"
            local candidate_ref="$2"
            local common_base
            common_base=$(git merge-base --all "$base_ref" "$candidate_ref")
            [[ "$common_base" =~ ^[0-9a-f]{40}$ ]]
            verify_version_only_tree "$common_base" "$candidate_ref"
          }

          verify_release_commit() {
            local commit_sha="$1"
            [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch origin \
              "+refs/heads/main:refs/remotes/origin/main"
            git merge-base --is-ancestor "$commit_sha" origin/main
            local commit_subject
            commit_subject=$(git show -s --format=%s "$commit_sha")
            test "$(bun scripts/app-release-state.ts release-subject-version \
              --subject "$commit_subject")" = "$VERSION"
            local parent_sha
            parent_sha=$(git rev-parse "${commit_sha}^")
            verify_version_only_tree "$parent_sha" "$commit_sha"
            if [[ "$VERSION" != *-* ]]; then
              verify_promotion "$commit_sha"
            fi
          }

          write_release_outputs() {
            echo "new_version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          }

          if [ "$RELEASE_SUBJECT_VERSION" = "$VERSION" ]; then
            MERGE_SHA="$GITHUB_SHA"
            verify_release_commit "$MERGE_SHA"

            MATCHING_PRS='[]'
            for PR_ASSOCIATION_ATTEMPT in $(seq 1 12); do
              ASSOCIATED_PRS=""
              if ASSOCIATED_PRS=$(gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls"); then
                MATCHING_PRS=$(jq -c \
                  --arg branch "$RELEASE_BRANCH" \
                  --arg repository "$GITHUB_REPOSITORY" \
                  --arg sha "$MERGE_SHA" \
                  --arg title "chore(release): v${VERSION}" \
                  '[.[] | select(
                    .state == "closed" and
                    .merged_at != null and
                    .merge_commit_sha == $sha and
                    .base.ref == "main" and
                    .head.ref == $branch and
                    .head.repo.full_name == $repository and
                    .title == $title
                  )]' <<<"$ASSOCIATED_PRS")
                MATCHING_PR_COUNT=$(jq -er 'length' <<<"$MATCHING_PRS")
                if [ "$MATCHING_PR_COUNT" -eq 1 ]; then
                  break
                fi
                if [ "$MATCHING_PR_COUNT" -gt 1 ]; then
                  echo "More than one merged release PR matched ${MERGE_SHA}." >&2
                  exit 1
                fi
              else
                echo "GitHub merged release PR query failed (${PR_ASSOCIATION_ATTEMPT}/12)." >&2
              fi

              if [ "$PR_ASSOCIATION_ATTEMPT" -eq 12 ]; then
                echo "GitHub did not expose the merged release PR for ${MERGE_SHA} after ${PR_ASSOCIATION_ATTEMPT} attempts." >&2
                exit 1
              fi
              echo "Waiting for GitHub to expose the merged release PR (${PR_ASSOCIATION_ATTEMPT}/12)."
              sleep 5
            done
            MATCHING_PR_NUMBER=$(jq -er '.[0].number' <<<"$MATCHING_PRS")
            MATCHING_PR=$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${MATCHING_PR_NUMBER}")
            test "$(jq -er '.number' <<<"$MATCHING_PR")" = "$MATCHING_PR_NUMBER"
            test "$(jq -er '.state' <<<"$MATCHING_PR")" = "closed"
            test "$(jq -er '.merge_commit_sha' <<<"$MATCHING_PR")" = "$MERGE_SHA"
            test "$(jq -er '.base.ref' <<<"$MATCHING_PR")" = "main"
            test "$(jq -er '.head.ref' <<<"$MATCHING_PR")" = "$RELEASE_BRANCH"
            test "$(jq -er '.head.repo.full_name' <<<"$MATCHING_PR")" = "$GITHUB_REPOSITORY"
            test "$(jq -er '.title' <<<"$MATCHING_PR")" = "chore(release): v${VERSION}"
            test "$(jq -er '.merged_by.type' <<<"$MATCHING_PR")" = "User"
            test "$(jq -er '.merged_by.login' <<<"$MATCHING_PR")" != "github-actions[bot]"

            RELEASE_PR_HEAD_SHA=$(jq -er '.head.sha' <<<"$MATCHING_PR")
            [[ "$RELEASE_PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            for RELEASE_CI_ATTEMPT in $(seq 1 12); do
              RELEASE_PR_RUNS=""
              SUCCESSFUL_RELEASE_CI_COUNT=0
              if RELEASE_PR_RUNS=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&branch=${RELEASE_BRANCH}&per_page=20"); then
                SUCCESSFUL_RELEASE_CI_COUNT=$(jq -er --arg sha "$RELEASE_PR_HEAD_SHA" \
                  '[.workflow_runs[] | select(
                    .head_sha == $sha and
                    .event == "pull_request" and
                    .status == "completed" and
                    .conclusion == "success"
                  )] | length' <<<"$RELEASE_PR_RUNS")
                if [ "$SUCCESSFUL_RELEASE_CI_COUNT" -ge 1 ]; then
                  break
                fi
              else
                echo "GitHub exact-head CI query failed (${RELEASE_CI_ATTEMPT}/12)." >&2
              fi

              if [ "$RELEASE_CI_ATTEMPT" -eq 12 ]; then
                echo "GitHub did not expose successful exact-head CI for ${RELEASE_PR_HEAD_SHA} after ${RELEASE_CI_ATTEMPT} attempts." >&2
                exit 1
              fi
              echo "Waiting for GitHub to expose successful exact-head CI (${RELEASE_CI_ATTEMPT}/12)."
              sleep 5
            done

            if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
              test "$(git rev-list -n 1 "$TAG")" = "$MERGE_SHA"
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "$MERGE_SHA" -m "Release ${TAG}"
              git push origin "refs/tags/${TAG}"
            fi
            write_release_outputs
            exit 0
          fi

          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} is already published; no release PR is needed."
            write_no_release_output
            exit 0
          fi

          ALL_PRS=$(gh pr list --state all --head "$RELEASE_BRANCH" --limit 100 \
            --json baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner,isCrossRepository,mergeCommit,number,state,title,url)
          PRS=$(bun scripts/app-release-state.ts filter-prs \
            --branch "$RELEASE_BRANCH" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --repository "${GITHUB_REPOSITORY#*/}" \
            <<<"$ALL_PRS")
          PR_COUNT=$(jq -er 'length' <<<"$PRS")
          if [ "$PR_COUNT" -gt 1 ]; then
            echo "Multiple release PRs use ${RELEASE_BRANCH}."
            exit 1
          fi

          PR_URL=""
          PR_STATE=""
          if [ "$PR_COUNT" -eq 1 ]; then
            PR_URL=$(jq -er '.[0].url' <<<"$PRS")
            PR_STATE=$(jq -er '.[0].state' <<<"$PRS")
            test "$(jq -er '.[0].baseRefName' <<<"$PRS")" = "main"
            test "$(jq -er '.[0].headRefName' <<<"$PRS")" = "$RELEASE_BRANCH"
            test "$(jq -er '.[0].title' <<<"$PRS")" = "chore(release): v${VERSION}"
            if [ "$PR_STATE" = "MERGED" ]; then
              echo "Release PR is already merged; its protected-merge run owns publication."
              write_no_release_output
              exit 0
            elif [ "$PR_STATE" != "OPEN" ]; then
              echo "Release PR is closed without being merged: ${PR_URL}"
              exit 1
            fi
          fi

          if [ -z "$PR_URL" ]; then
            if git ls-remote --exit-code origin "refs/heads/${RELEASE_BRANCH}" >/dev/null 2>&1; then
              git fetch origin "refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
              git switch --detach "origin/${RELEASE_BRANCH}"
            else
              bun scripts/app-release-state.ts expected-manifest \
                --base package.json \
                --output package.json \
                --version "$VERSION"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git switch -c "$RELEASE_BRANCH"
              git add package.json
              git commit -m "chore(release): v${VERSION}"
              git push origin "$RELEASE_BRANCH"
            fi

            git fetch origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
            verify_release_branch_base "origin/main" "origin/${RELEASE_BRANCH}"
            PR_CREATE_ERROR="$RUNNER_TEMP/release-pr-create-error.log"
            for PR_CREATE_ATTEMPT in $(seq 1 4); do
              if PR_URL=$(gh pr create \
                --base main \
                --head "$RELEASE_BRANCH" \
                --title "chore(release): v${VERSION}" \
                --body "Automated desktop app version release. CI must pass for this exact commit. A maintainer must merge this PR manually to publish the release." \
                2>"$PR_CREATE_ERROR"); then
                break
              fi

              cat "$PR_CREATE_ERROR" >&2
              PR_URL=""
              RECOVERY_ALL_PRS=""
              if RECOVERY_ALL_PRS=$(gh pr list --state open --head "$RELEASE_BRANCH" --limit 100 \
                --json baseRefName,headRefName,headRefOid,headRepository,headRepositoryOwner,isCrossRepository,mergeCommit,number,state,title,url); then
                RECOVERY_PRS=$(bun scripts/app-release-state.ts filter-prs \
                  --branch "$RELEASE_BRANCH" \
                  --owner "$GITHUB_REPOSITORY_OWNER" \
                  --repository "${GITHUB_REPOSITORY#*/}" \
                  <<<"$RECOVERY_ALL_PRS")
                RECOVERY_PR_COUNT=$(jq -er 'length' <<<"$RECOVERY_PRS")
                if [ "$RECOVERY_PR_COUNT" -gt 1 ]; then
                  echo "Multiple release PRs appeared after creation failed for ${RELEASE_BRANCH}." >&2
                  exit 1
                fi
                if [ "$RECOVERY_PR_COUNT" -eq 1 ]; then
                  test "$(jq -er '.[0].baseRefName' <<<"$RECOVERY_PRS")" = "main"
                  test "$(jq -er '.[0].headRefName' <<<"$RECOVERY_PRS")" = "$RELEASE_BRANCH"
                  test "$(jq -er '.[0].state' <<<"$RECOVERY_PRS")" = "OPEN"
                  test "$(jq -er '.[0].title' <<<"$RECOVERY_PRS")" = "chore(release): v${VERSION}"
                  PR_URL=$(jq -er '.[0].url' <<<"$RECOVERY_PRS")
                  echo "Adopted release PR after an ambiguous creation failure: ${PR_URL}" >&2
                  break
                fi
              fi

              if [ "$PR_CREATE_ATTEMPT" -eq 4 ]; then
                echo "GitHub did not create the release PR after ${PR_CREATE_ATTEMPT} attempts." >&2
                exit 1
              fi
              echo "GitHub PR creation failed; retrying (${PR_CREATE_ATTEMPT}/4)." >&2
              sleep $((PR_CREATE_ATTEMPT * 5))
            done
            test -n "$PR_URL"
            PR_STATE="OPEN"
          fi

          if [ "$PR_STATE" = "OPEN" ]; then
            PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq '.number')
            for VALIDATION_ATTEMPT in $(seq 1 3); do
              PR_DETAILS=$(gh pr view "$PR_URL" \
                --json baseRefName,headRefName,headRefOid,state,title)
              CURRENT_PR_STATE=$(jq -er '.state' <<<"$PR_DETAILS")
              if [ "$CURRENT_PR_STATE" = "MERGED" ]; then
                echo "Release PR merged after validation; its protected-merge run owns publication."
                write_no_release_output
                exit 0
              fi
              exit_if_release_pr_closed "$CURRENT_PR_STATE"
              test "$CURRENT_PR_STATE" = "OPEN"
              test "$(jq -er '.baseRefName' <<<"$PR_DETAILS")" = "main"
              test "$(jq -er '.headRefName' <<<"$PR_DETAILS")" = "$RELEASE_BRANCH"
              test "$(jq -er '.title' <<<"$PR_DETAILS")" = "chore(release): v${VERSION}"
              HEAD_SHA=$(jq -er '.headRefOid' <<<"$PR_DETAILS")
              [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]

              git fetch origin \
                "+refs/heads/main:refs/remotes/origin/main" \
                "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
              test "$(git rev-parse "origin/${RELEASE_BRANCH}")" = "$HEAD_SHA"
              MAIN_SHA=$(git rev-parse origin/main)
              verify_release_branch_base "$MAIN_SHA" "$HEAD_SHA"

              if ! git merge-base --is-ancestor "$MAIN_SHA" "$HEAD_SHA"; then
                gh api --method PUT \
                  "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
                  -f "expected_head_sha=${HEAD_SHA}" >/dev/null
                for UPDATE_ATTEMPT in $(seq 1 30); do
                  UPDATED_SHA=$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')
                  if [ "$UPDATED_SHA" != "$HEAD_SHA" ]; then
                    HEAD_SHA="$UPDATED_SHA"
                    break
                  fi
                  echo "Waiting for release branch update (${UPDATE_ATTEMPT}/30)."
                  sleep 2
                done
                test "$HEAD_SHA" != "$(jq -er '.headRefOid' <<<"$PR_DETAILS")"
              fi

              git fetch origin \
                "+refs/heads/main:refs/remotes/origin/main" \
                "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
              test "$(git rev-parse "origin/${RELEASE_BRANCH}")" = "$HEAD_SHA"
              MAIN_SHA=$(git rev-parse origin/main)
              if ! git merge-base --is-ancestor "$MAIN_SHA" "$HEAD_SHA"; then
                if [ "$VALIDATION_ATTEMPT" -eq 3 ]; then
                  echo "Release PR remained behind main after branch update retries."
                  exit 1
                fi
                echo "Main advanced during release branch synchronization; retrying."
                continue
              fi
              verify_version_only_tree "$MAIN_SHA" "$HEAD_SHA"

              RUN_ID=""
              for RUN_ATTEMPT in $(seq 1 60); do
                RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&branch=${RELEASE_BRANCH}&per_page=20")
                if RUN_ID=$(jq -er --arg sha "$HEAD_SHA" \
                  '.workflow_runs | map(select(.head_sha == $sha and .event == "pull_request")) | first | .id' <<<"$RUNS"); then
                  break
                fi
                echo "Waiting for PR-associated exact-head CI run (${RUN_ATTEMPT}/60)."
                sleep 5
              done
              test -n "$RUN_ID"

              RUN_DETAILS=$(gh run view "$RUN_ID" --json attempt,conclusion,event,headSha,status)
              test "$(jq -er '.event' <<<"$RUN_DETAILS")" = "pull_request"
              test "$(jq -er '.headSha' <<<"$RUN_DETAILS")" = "$HEAD_SHA"
              RUN_STATUS=$(jq -er '.status' <<<"$RUN_DETAILS")
              RUN_CONCLUSION=$(jq -r '.conclusion // ""' <<<"$RUN_DETAILS")
              if [ "$RUN_STATUS" = "completed" ] && [ "$RUN_CONCLUSION" = "action_required" ]; then
                PREVIOUS_ATTEMPT=$(jq -er '.attempt' <<<"$RUN_DETAILS")
                gh run rerun "$RUN_ID"
                for RERUN_ATTEMPT in $(seq 1 30); do
                  CURRENT_ATTEMPT=$(gh run view "$RUN_ID" --json attempt --jq '.attempt')
                  if [ "$CURRENT_ATTEMPT" -gt "$PREVIOUS_ATTEMPT" ]; then
                    break
                  fi
                  echo "Waiting for PR-associated CI rerun (${RERUN_ATTEMPT}/30)."
                  sleep 2
                done
                test "$CURRENT_ATTEMPT" -gt "$PREVIOUS_ATTEMPT"
              elif [ "$RUN_STATUS" = "completed" ] && [ "$RUN_CONCLUSION" != "success" ]; then
                echo "PR-associated CI is in terminal state: ${RUN_CONCLUSION}."
                exit 1
              fi
              gh run watch "$RUN_ID" --exit-status

              AFTER_VALIDATION=$(gh pr view "$PR_URL" \
                --json headRefOid,state)
              test "$(jq -er '.headRefOid' <<<"$AFTER_VALIDATION")" = "$HEAD_SHA"
              AFTER_VALIDATION_STATE=$(jq -er '.state' <<<"$AFTER_VALIDATION")
              if [ "$AFTER_VALIDATION_STATE" = "MERGED" ]; then
                echo "Release PR merged after validation; its protected-merge run owns publication."
                write_no_release_output
                exit 0
              fi
              exit_if_release_pr_closed "$AFTER_VALIDATION_STATE"
              test "$AFTER_VALIDATION_STATE" = "OPEN"
              git fetch origin "+refs/heads/main:refs/remotes/origin/main"
              MAIN_SHA=$(git rev-parse origin/main)
              if git merge-base --is-ancestor "$MAIN_SHA" "$HEAD_SHA"; then
                break
              fi
              if [ "$VALIDATION_ATTEMPT" -eq 3 ]; then
                echo "Release PR remained behind main after strict-base validation retries."
                exit 1
              fi
            done
          fi

          echo "Release PR ready for maintainer review: ${PR_URL}"
          write_no_release_output

  # OpenWaggle's Electrobun native layer for every target, checked against the supported-platform
  # floor before anything is packaged with it.
  native:
    name: Electrobun native layer
    needs: version
    if: needs.version.outputs.should_release == 'true'
    uses: ./.github/workflows/electrobun-native.yml
    with:
      probes: false

  # Electrobun packages one architecture per runner: OpenWaggle's native layer is built and
  # floor-checked natively (electrobun-native.yml), and each app is launched on its own CPU.
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: [version, native]
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          # GitHub retired the macos-14 image; jobs on it are cancelled before any step runs.
          - { arch: arm64, runner: macos-15, target: darwin-arm64 }
          - { arch: x64, runner: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: ./.github/actions/install-hutch
        with:
          version: ${{ env.HUTCH_VERSION }}

      # OpenWaggle's Electrobun native layer for this target, built and floor-checked by the
      # native job (electrobun-native.yml); Hutch packages against it instead of its own download.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electrobun-native-${{ matrix.target }}
          path: out

      - name: Unpack the Electrobun native layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/electrobun-native
          tar -xzf out/electrobun-native-${{ matrix.target }}.tgz -C out/electrobun-native
          echo "HUTCH_ELECTROBUN_DEVKIT_ROOT=$GITHUB_WORKSPACE/out/electrobun-native/${{ matrix.target }}/devkit" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: Stamp release Build channel
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.new_version }}'
          case "$version" in
            *-alpha.*) channel=alpha ;;
            *-beta.*) channel=beta ;;
            *-rc.*) channel=rc ;;
            *-*) echo "Unrecognized prerelease id in $version" >&2; exit 1 ;;
            *) channel=stable ;;
          esac
          echo "OPENWAGGLE_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Require macOS signing for release candidates and Stable
        shell: bash
        env:
          MACOS_SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          MACOS_NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          case "$OPENWAGGLE_RELEASE_CHANNEL" in
            rc|stable)
              if [ "$MACOS_SIGNING_CONFIGURED" != "true" ] || [ "$MACOS_NOTARIZATION_CONFIGURED" != "true" ]; then
                echo "::error::${OPENWAGGLE_RELEASE_CHANNEL} macOS builds must be signed and notarized; configure the macOS signing secrets." >&2
                exit 1
              fi
              ;;
          esac

      - run: bun run build

      - name: Import the macOS Developer ID
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/electrobun/ci/macos-import-identity.sh

      # Notarization and stapling retry Apple's transport failures (notarytool losing Apple while it
      # polls, 1.0.0-beta.1; stapler losing the ticket service, 1.0.0-beta.36) and hdiutil retries
      # its device errors (1.0.0-beta.8), inside scripts/electrobun/notarize-macos.ts and
      # macos-dmg.ts, so a runner blip retries one call instead of the whole build. Spotlight
      # indexing and XProtect still make hdiutil flaky on hosted runners (actions/runner-images#7522).
      - name: Package macOS with Electrobun
        shell: bash
        env:
          OPENWAGGLE_HUTCH: hutch electrobun
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          args=(--arch "${{ matrix.arch }}")
          # Squirrel.Mac in the Electron installs accepts the transition zip only if it satisfies
          # their designated requirement: the same bundle identifier and Team ID.
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "${OPENWAGGLE_MACOS_SIGN_IDENTITY:-}" ]; then
            args+=(--requirement "$(bun -e "import('./scripts/electrobun-transition/macos-transition-zip.ts').then((m) => console.log(m.developerIdRequirement('com.openwaggle.app', process.env.APPLE_TEAM_ID)))")")
          fi
          bun scripts/electrobun/package.ts "${args[@]}"
          mkdir -p dist
          cp out/electrobun/release/* dist/

      - name: Check macOS native platform floor
        run: bun scripts/check-native-platform-floor.ts

      - name: Verify macOS signing and notarization
        shell: bash
        env:
          MACOS_SIGNING_CONFIGURED: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          MACOS_NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(out/electrobun/inner/*/*.app)
          [ "${#apps[@]}" -eq 1 ]
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          if [ "$MACOS_SIGNING_CONFIGURED" != "true" ]; then
            echo "macOS signing is not configured; this ${OPENWAGGLE_RELEASE_CHANNEL} build is signed ad hoc."
            exit 0
          fi
          if [ "$MACOS_NOTARIZATION_CONFIGURED" = "true" ]; then
            xcrun stapler validate "${apps[0]}"
            spctl --assess --type execute --verbose "${apps[0]}"
          fi
          # The DMG users download is signed, notarized and stapled itself, not only the app inside.
          dmgs=(dist/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ]
          for dmg in "${dmgs[@]}"; do
            codesign --verify --strict --verbose=2 "$dmg"
            if [ "$MACOS_NOTARIZATION_CONFIGURED" = "true" ]; then
              xcrun stapler validate "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose "$dmg"
            fi
          done

      - name: Smoke packaged macOS runtime
        run: bun run packaged-app:smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-${{ matrix.arch }}-build
          path: dist/*
          if-no-files-found: error

      # The minified bundles' hidden source maps, to map field stack traces back to source. Never in
      # the app, and not release assets (the publish job downloads only *-artifacts).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.arch == 'arm64'
        with:
          name: macos-source-maps
          path: out/**/*.map
          retention-days: 90

  # electron-updater reads one `*-mac.yml` for both architectures, so it is written once both
  # transition zips exist.
  macos-update-metadata:
    name: macOS update metadata
    needs: [version, build-macos]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: macos-*-build
          path: dist
          merge-multiple: true

      - name: Prepare macOS update channels
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.new_version }}'
          case "$version" in
            *-alpha.*) export OPENWAGGLE_RELEASE_CHANNEL=alpha ;;
            *-beta.*) export OPENWAGGLE_RELEASE_CHANNEL=beta ;;
            *-rc.*) export OPENWAGGLE_RELEASE_CHANNEL=rc ;;
            *) export OPENWAGGLE_RELEASE_CHANNEL=stable ;;
          esac
          bun scripts/electrobun/package.ts metadata dist mac
          ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-artifacts
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: [version, native]
    if: needs.version.outputs.should_release == 'true'
    # Ubuntu 22.04 (glibc 2.35) is the supported Linux floor (scripts/supported-platform-floor.ts);
    # building on ubuntu-latest (24.04) made a native module need glibc 2.38 in 1.0.0-beta.25.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: ./.github/actions/install-hutch
        with:
          version: ${{ env.HUTCH_VERSION }}

      # OpenWaggle's Electrobun native layer for this target, built and floor-checked by the
      # native job (electrobun-native.yml); Hutch packages against it instead of its own download.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electrobun-native-linux-x64
          path: out

      - name: Unpack the Electrobun native layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/electrobun-native
          tar -xzf out/electrobun-native-linux-x64.tgz -C out/electrobun-native
          echo "HUTCH_ELECTROBUN_DEVKIT_ROOT=$GITHUB_WORKSPACE/out/electrobun-native/linux-x64/devkit" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: Stamp release Build channel
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.new_version }}'
          case "$version" in
            *-alpha.*) channel=alpha ;;
            *-beta.*) channel=beta ;;
            *-rc.*) channel=rc ;;
            *-*) echo "Unrecognized prerelease id in $version" >&2; exit 1 ;;
            *) channel=stable ;;
          esac
          echo "OPENWAGGLE_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - run: bun run build

      # Hutch builds the delta patch from the previous release that has Electrobun update files.
      - name: Find the release to build a delta patch against
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(bun scripts/electrobun/patch-base-url.ts '${{ needs.version.outputs.new_version }}' linux x64)"
          echo "OPENWAGGLE_ELECTROBUN_PATCH_BASE_URL=$base" >> "$GITHUB_ENV"
          echo "Delta patch base: ${base:-none}"

      # The transition AppImage (build/electrobun-transition/AppRun.sh) that electron-updater swaps
      # in for the Electron AppImage.
      - name: Package Linux with Electrobun
        shell: bash
        env:
          OPENWAGGLE_HUTCH: hutch electrobun
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          set -euo pipefail
          sudo apt-get install -y -q libfuse2 zstd
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          bun scripts/electrobun/package.ts --appimagetool "$RUNNER_TEMP/appimagetool"
          mkdir -p dist
          cp out/electrobun/release/* dist/

      - name: Check Linux native platform floor
        run: bun scripts/check-native-platform-floor.ts

      - name: Prepare Linux update channels
        run: bun scripts/prepare-update-channel-metadata.ts dist "$OPENWAGGLE_RELEASE_CHANNEL" linux

      - name: Smoke packaged Linux runtime
        run: bun run packaged-app:smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-artifacts
          path: dist/*
          if-no-files-found: error

      # The minified bundles' hidden source maps, to map field stack traces back to source. Never in
      # the app, and not release assets (the publish job downloads only *-artifacts).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-source-maps
          path: out/**/*.map
          retention-days: 90

  build-windows:
    name: Build Windows
    needs: [version, native]
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: ./.github/actions/install-hutch
        with:
          version: ${{ env.HUTCH_VERSION }}

      # OpenWaggle's Electrobun native layer for this target, built and floor-checked by the
      # native job (electrobun-native.yml); Hutch packages against it instead of its own download.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electrobun-native-win32-x64
          path: out

      - name: Unpack the Electrobun native layer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/electrobun-native
          tar -xzf out/electrobun-native-win32-x64.tgz -C out/electrobun-native
          echo "HUTCH_ELECTROBUN_DEVKIT_ROOT=$GITHUB_WORKSPACE/out/electrobun-native/win32-x64/devkit" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: Stamp release Build channel
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.version.outputs.new_version }}'
          case "$version" in
            *-alpha.*) channel=alpha ;;
            *-beta.*) channel=beta ;;
            *-rc.*) channel=rc ;;
            *-*) echo "Unrecognized prerelease id in $version" >&2; exit 1 ;;
            *) channel=stable ;;
          esac
          echo "OPENWAGGLE_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"

      - run: bun run build

      # Hutch builds the delta patch from the previous release that has Electrobun update files.
      - name: Find the release to build a delta patch against
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(bun scripts/electrobun/patch-base-url.ts '${{ needs.version.outputs.new_version }}' win x64)"
          echo "OPENWAGGLE_ELECTROBUN_PATCH_BASE_URL=$base" >> "$GITHUB_ENV"
          echo "Delta patch base: ${base:-none}"

      # Authenticode signing (scripts/electrobun/sign-windows.ts) runs when a certificate secret is
      # configured; without one the build is unsigned.
      - name: Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64) { Write-Output 'Windows signing is not configured; this build is unsigned.'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          Add-Content -Path $env:GITHUB_ENV -Value "OPENWAGGLE_WINDOWS_SIGN_PFX=$pfx"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENWAGGLE_WINDOWS_SIGN_TIMESTAMP_URL=http://timestamp.digicert.com"

      # The NSIS transition installer (build/electrobun-transition/windows-transition.nsi) that
      # electron-updater runs like the Electron installer it replaces, around Electrobun's Setup.
      - name: Package Windows with Electrobun
        shell: bash
        env:
          OPENWAGGLE_HUTCH: hutch electrobun
          OPENWAGGLE_WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # vendor/electrobun/build.ts downloaded it and checked Microsoft's Authenticode signature.
          webview2="$GITHUB_WORKSPACE/out/electrobun-native/win32-x64/webview2/MicrosoftEdgeWebview2Setup.exe"
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          [ -x "$makensis" ] || choco install nsis -y --no-progress
          bun scripts/electrobun/package.ts --webview2 "$webview2" --makensis "$makensis"
          mkdir -p dist
          cp out/electrobun/release/* dist/

      - name: Check Windows native platform floor
        run: bun scripts/check-native-platform-floor.ts

      - name: Prepare Windows update channels
        shell: bash
        run: bun scripts/prepare-update-channel-metadata.ts dist "$OPENWAGGLE_RELEASE_CHANNEL" windows

      - name: Smoke packaged Windows runtime
        run: bun run packaged-app:smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-artifacts
          path: dist/*
          if-no-files-found: error

      # The minified bundles' hidden source maps, to map field stack traces back to source. Never in
      # the app, and not release assets (the publish job downloads only *-artifacts).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-source-maps
          path: out/**/*.map
          retention-days: 90

  verify-installers:
    name: Verify release installers
    needs: [version, macos-update-metadata, build-linux, build-windows]
    if: needs.version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux-artifacts
          - os: macos-latest
            platform: macos
            artifact_name: macos-artifacts
          - os: windows-latest
            platform: windows
            artifact_name: windows-artifacts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/release/${{ matrix.platform }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.platform == 'windows'
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        if: matrix.platform == 'windows'
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install Windows verifier dependencies
        if: matrix.platform == 'windows'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify Linux installer
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.version.outputs.new_version }}'
          ARTIFACT_DIR="$RUNNER_TEMP/release/linux"
          APPIMAGE_NAME="openwaggle-${VERSION}-x86_64.AppImage"
          APPIMAGE_PATH="$ARTIFACT_DIR/$APPIMAGE_NAME"
          test -f "$APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"

          bash -n scripts/install.sh
          MOCK_RELEASE_DIR="$RUNNER_TEMP/mock-release"
          mkdir -p "$MOCK_RELEASE_DIR"
          cp "$APPIMAGE_PATH" "$MOCK_RELEASE_DIR/$APPIMAGE_NAME"
          (
            cd "$MOCK_RELEASE_DIR"
            sha256sum "$APPIMAGE_NAME" > SHA256SUMS.txt
          )

          RELEASE_JSON_PATH="$MOCK_RELEASE_DIR/release.json"
          APPIMAGE_URL="file://$MOCK_RELEASE_DIR/$APPIMAGE_NAME"
          SHA_URL="file://$MOCK_RELEASE_DIR/SHA256SUMS.txt"
          cat > "$RELEASE_JSON_PATH" <<JSON
          {
            "tag_name": "v${VERSION}",
            "assets": [
              { "browser_download_url": "${APPIMAGE_URL}" },
              { "browser_download_url": "${SHA_URL}" }
            ]
          }
          JSON

          TMP_HOME="$RUNNER_TEMP/home"
          mkdir -p "$TMP_HOME"
          export HOME="$TMP_HOME"
          export XDG_DATA_HOME="$HOME/.local/share"
          export PATH="$HOME/.local/bin:$PATH"
          export OPENWAGGLE_RELEASE_API_URL="file://$RELEASE_JSON_PATH"
          bash scripts/install.sh

          test -x "$HOME/.local/bin/openwaggle"
          test -f "$HOME/.local/share/applications/openwaggle.desktop"

      - name: Verify macOS installers
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.version.outputs.new_version }}'
          ARTIFACT_DIR="$RUNNER_TEMP/release/macos"
          ARM64_DMG="openwaggle-${VERSION}-arm64.dmg"
          X64_DMG="openwaggle-${VERSION}-x64.dmg"
          ARM64_ZIP="openwaggle-${VERSION}-arm64.zip"
          X64_ZIP="openwaggle-${VERSION}-x64.zip"
          test -f "$ARTIFACT_DIR/$ARM64_DMG"
          test -f "$ARTIFACT_DIR/$X64_DMG"
          test -f "$ARTIFACT_DIR/$ARM64_ZIP"
          test -f "$ARTIFACT_DIR/$X64_ZIP"

          # Electrobun's updater files and the electron-updater metadata for the transition zips.
          for ARCH in arm64 x64; do
            test -f "$ARTIFACT_DIR/stable-macos-${ARCH}-update-v2.json"
            ls "$ARTIFACT_DIR"/stable-macos-${ARCH}-*.tar.zst >/dev/null
          done
          ls "$ARTIFACT_DIR"/*-mac.yml >/dev/null

          MOUNT_POINT="$(hdiutil attach -nobrowse -readonly "$ARTIFACT_DIR/$ARM64_DMG" | awk -F'\t' '/\/Volumes\// { print $NF; exit }')"
          trap 'hdiutil detach "$MOUNT_POINT" -quiet >/dev/null 2>&1 || true' EXIT
          APP_PATH=$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' | head -n 1)
          test -d "$APP_PATH"
          # The executable Squirrel.Mac names the installed bundle after, and the launcher
          # Electrobun's updater requires (scripts/electrobun-transition/macos-transition-bundle.ts).
          test -x "$APP_PATH/Contents/MacOS/OpenWaggle"
          test -x "$APP_PATH/Contents/MacOS/launcher"
          codesign --verify --deep --strict "$APP_PATH"

          # The transition zip unpacks to the same signed app.
          UNZIPPED="$RUNNER_TEMP/transition-zip"
          ditto -x -k "$ARTIFACT_DIR/$ARM64_ZIP" "$UNZIPPED"
          codesign --verify --deep --strict "$(find "$UNZIPPED" -maxdepth 1 -name '*.app' | head -n 1)"

      - name: Verify Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}\release\windows
        run: bun scripts/electrobun/ci/smoke.ts install "$env:RELEASE_DIRECTORY"

  release:
    name: Create GitHub Release
    needs: [version, verify-installers]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.version.outputs.new_tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: '*-artifacts'
          path: artifacts

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Prepare Stable release notes
        if: ${{ !contains(needs.version.outputs.new_version, '-') }}
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.new_version }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/app-release-notes.ts write \
            --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/release-notes.md"

      - name: Collect release assets
        run: |
          mkdir -p release
          # The transition artifacts and their electron-updater metadata (*.yml), the downloads for new
          # installs (*.dmg, *-setup.zip, *.tar.gz), and Electrobun's updater files: its manifests
          # (*update*.json), archives (*.tar.zst) and delta patches (*.patch). No blockmaps: a
          # transition download shares no blocks with the Electron install it replaces.
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.exe' \
            -o -name '*.tar.gz' -o -name '*.tar.zst' -o -name '*.patch' -o -name '*update*.json' \
            -o -name '*.yml' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt

      # softprops publishes a prerelease before it uploads, so beta.25's update checks briefly got a
      # 404 for beta-mac.yml. Upload to a draft, verify it, then publish. A rerun after publication
      # leaves the published release alone and only verifies it.
      - name: Find an already published release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = "false" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload GitHub Release as a draft
        if: steps.existing-release.outputs.published != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: ${{ needs.version.outputs.new_tag }}
          draft: true
          prerelease: ${{ contains(needs.version.outputs.new_version, '-') }}
          make_latest: ${{ contains(needs.version.outputs.new_version, '-') && 'false' || 'true' }}
          # Prereleases use generated notes; Stable uses its CHANGELOG.md entry.
          generate_release_notes: ${{ contains(needs.version.outputs.new_version, '-') }}
          body_path: ${{ !contains(needs.version.outputs.new_version, '-') && format('{0}/release-notes.md', runner.temp) || '' }}
          files: release/*

      - name: Verify draft release assets
        if: steps.existing-release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-release-assets.ts \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --dir release

      - name: Publish GitHub Release
        if: steps.existing-release.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.new_tag }}
          RELEASE_PRERELEASE: ${{ contains(needs.version.outputs.new_version, '-') }}
          # Only Stable app releases become the repository's Latest release.
          RELEASE_LATEST: ${{ contains(needs.version.outputs.new_version, '-') && 'false' || 'true' }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --prerelease="$RELEASE_PRERELEASE" --latest="$RELEASE_LATEST"

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-release-assets.ts \
            --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --dir release --published
