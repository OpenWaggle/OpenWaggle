<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Electrobun probe shell</title>
    <style>
      body { margin: 0; font: 15px system-ui, sans-serif; background: #161b26; color: #e8ecf4; }
      header { padding: 18px 24px; border-bottom: 1px solid #2c3445; }
      h1 { margin: 0; font-size: 20px; }
      main { padding: 16px 24px; width: 420px; }
      dt { color: #8f9bb3; margin-top: 10px; }
      dd { margin: 2px 0 0; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <header><h1 id="shell">OpenWaggle native layer probe</h1></header>
    <main>
      <p>System webview shell. The panel on the right is a CEF browser preview driven over CDP.</p>
      <dl>
        <dt>User agent</dt><dd id="ua"></dd>
        <dt>Rendered at</dt><dd id="rendered"></dd>
      </dl>
    </main>
    <script>
      document.getElementById('ua').textContent = navigator.userAgent
      document.getElementById('rendered').textContent = new Date().toISOString()
    </script>
  </body>
</html>
