<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWaggle composer prototypes</title>
    <style>
      :root {
        color-scheme: dark;
        --workbench: #141719;
        --tool-tray: #1a1d22;
        --raised-tool: #20242b;
        --tool-hover: #262b33;
        --steel-line: #343a46;
        --quiet-line: #292f39;
        --paper: #eef0f4;
        --ink: #e7e9ee;
        --ink-soft: #c9cdd6;
        --ink-muted: #9098a8;
        --amber-signal: #f5a623;
        --setup-blue: #77baf2;
        --danger: #f87171;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--workbench); color: var(--ink); }
      button, textarea { font: inherit; }
      button { color: inherit; }
      svg.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }

      .study { min-height: 100vh; display: flex; flex-direction: column; padding: 30px 36px 96px; }
      .study-header { width: min(1040px, 100%); margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
      .eyebrow { margin-bottom: 7px; color: var(--amber-signal); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
      .study-header p { max-width: 620px; margin: 8px 0 0; color: var(--ink-muted); font-size: 13px; line-height: 1.6; }
      .mock-only { flex: 0 0 auto; border: 1px solid var(--quiet-line); border-radius: 999px; padding: 6px 10px; color: var(--ink-muted); font-size: 11px; }
      .stage { width: min(1040px, 100%); margin: auto; padding-top: 70px; }
      .variant-intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; margin: 0 16px 16px; }
      .variant-intro strong { font-size: 14px; }
      .variant-intro span { max-width: 560px; color: var(--ink-muted); font-size: 12px; text-align: right; }

      .codex-frame { border-radius: 32px; background: var(--tool-tray); }
      .preflight { min-height: 58px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 26px; padding: 8px 28px; color: var(--ink-soft); }
      .preflight-item, .preflight-button { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
      .preflight-button { border: 0; border-radius: 8px; background: transparent; padding: 7px 8px; cursor: pointer; }
      .preflight-button:hover, .icon-button:hover, .text-button:hover { background: var(--tool-hover); color: var(--ink); }
      .preflight-button[aria-expanded="true"] { background: var(--raised-tool); color: var(--ink); }
      .preflight .icon { color: var(--ink-muted); }
      .preflight .chevron { width: 13px; height: 13px; margin-left: 1px; }
      .brand-mark { display: grid; width: 23px; height: 23px; place-items: center; border: 1px solid color-mix(in srgb, var(--amber-signal) 55%, var(--steel-line)); border-radius: 7px; color: var(--amber-signal); font-size: 10px; font-weight: 800; }

      .composer { position: relative; border: 1px solid var(--steel-line); border-radius: 29px; background: var(--raised-tool); }
      .prompt { display: block; width: 100%; min-height: 154px; resize: none; border: 0; outline: 0; background: transparent; padding: 24px 26px; color: var(--ink); font-size: 17px; line-height: 1.5; }
      .prompt::placeholder { color: color-mix(in srgb, var(--ink-muted) 72%, transparent); }
      .toolbar { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 10px 16px 12px 20px; }
      .toolbar-cluster { min-width: 0; display: flex; align-items: center; gap: 8px; }
      .icon-button, .text-button { border: 0; border-radius: 8px; background: transparent; cursor: pointer; }
      .icon-button { display: grid; width: 36px; height: 36px; place-items: center; color: var(--ink-muted); }
      .text-button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 6px 9px; color: var(--ink-soft); }
      .text-button .icon { width: 16px; height: 16px; }
      .access-button { color: var(--amber-signal); }
      .model { white-space: nowrap; color: var(--ink-soft); }
      .effort { color: var(--ink-muted); }
      .context-ring { display: grid; width: 34px; height: 34px; place-items: center; border: 3px solid var(--steel-line); border-radius: 50%; color: var(--ink-muted); font: 11px ui-monospace, monospace; }
      .send-button { width: 42px; height: 42px; border-radius: 50%; background: var(--paper); color: #17191c; }
      .send-button:hover { background: #dfe3e9; color: #17191c; }

      .conversation { min-height: 300px; border-top: 1px solid var(--quiet-line); padding: 34px 34px 28px; background: color-mix(in srgb, var(--workbench) 58%, var(--tool-tray)); }
      .user-turn { display: flex; justify-content: flex-end; margin-bottom: 28px; }
      .user-bubble { max-width: 70%; border: 1px solid var(--quiet-line); border-radius: 18px 18px 5px 18px; background: var(--raised-tool); padding: 12px 15px; color: var(--ink-soft); font-size: 13px; line-height: 1.55; }
      .worktree-event { width: min(720px, 100%); margin: 0 auto; }
      .worktree-event-title { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; color: var(--ink-soft); font-size: 12px; }
      .worktree-event-title .icon { width: 14px; height: 14px; color: var(--ink-muted); }
      .worktree-setup { border: 1px solid var(--steel-line); border-radius: 13px; background: color-mix(in srgb, var(--tool-tray) 88%, transparent); padding: 12px 14px 10px; }
      .setup-status { display: flex; align-items: center; gap: 10px; min-height: 29px; color: var(--ink-muted); font-size: 12px; }
      .setup-status.active { color: var(--setup-blue); }
      .setup-dot { position: relative; width: 13px; height: 13px; flex: 0 0 auto; border: 1.5px solid #656c77; border-radius: 50%; }
      .setup-status.active .setup-dot { border-color: color-mix(in srgb, var(--setup-blue) 38%, #656c77); }
      .setup-status.active .setup-dot::after { content: ""; position: absolute; inset: -1.5px; border: 1.5px solid transparent; border-top-color: var(--setup-blue); border-right-color: var(--setup-blue); border-radius: 50%; animation: spin .8s linear infinite; }
      .setup-status.complete .setup-dot { border-color: #6d9f82; }
      .setup-status.complete .setup-dot::after { content: ""; position: absolute; left: 3px; top: 1px; width: 4px; height: 7px; border: solid #78b58f; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
      @keyframes spin { to { transform: rotate(360deg); } }
      .setup-status-copy { min-width: 0; flex: 1; }
      .setup-progress { display: flex; align-items: center; gap: 10px; margin-left: auto; color: var(--ink-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
      .setup-progress-track { width: 94px; height: 6px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--ink-muted) 14%, transparent); }
      .setup-progress-fill { width: 64%; height: 100%; border-radius: inherit; background: var(--setup-blue); }
      .setup-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 4px; }
      .setup-link, .setup-action { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 7px; background: transparent; padding: 7px 4px; color: var(--ink-muted); font-size: 11px; cursor: pointer; }
      .setup-link:hover, .setup-action:hover { color: var(--ink-soft); }
      .setup-link .icon, .setup-action .icon { width: 13px; height: 13px; }
      .setup-link .chevron { transition: transform .15s ease; }
      .setup-link[aria-expanded="true"] .chevron { transform: rotate(180deg); }
      .setup-actions { display: flex; align-items: center; gap: 14px; }
      .setup-output { margin: 7px 0 5px 23px; border-top: 1px solid var(--quiet-line); padding: 10px 0 3px; color: var(--ink-muted); font: 10px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
      .starting-task { display: flex; align-items: center; gap: 9px; margin: 4px 0 0 2px; color: var(--ink-muted); font-size: 12px; }
      .starting-task .setup-dot { border-color: color-mix(in srgb, var(--setup-blue) 38%, #656c77); }
      .starting-task .setup-dot::after { content: ""; position: absolute; inset: -1.5px; border: 1.5px solid transparent; border-top-color: var(--setup-blue); border-right-color: var(--setup-blue); border-radius: 50%; animation: spin .8s linear infinite; }
      .assistant-start { width: min(560px, 100%); margin: 24px auto 0; color: var(--ink-soft); font-size: 13px; line-height: 1.6; }
      .assistant-start-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--ink-muted); font-size: 11px; }
      .stream-cursor { display: inline-block; width: 7px; height: 14px; margin-left: 3px; vertical-align: -2px; background: var(--ink-soft); animation: blink .8s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .conversation-composer { margin: 0 20px 20px; }
      .conversation-composer .prompt { min-height: 88px; }
      .replay-button { margin-left: auto; border: 0; border-radius: 7px; background: transparent; padding: 5px 7px; color: var(--ink-muted); font-size: 10px; cursor: pointer; }
      .replay-button:hover { background: var(--tool-hover); color: var(--ink-soft); }

      .dropdown-wrap { position: relative; }
      .popover { position: absolute; z-index: 10; top: calc(100% + 6px); left: 0; width: 340px; border: 1px solid var(--steel-line); border-radius: 15px; background: var(--tool-tray); padding: 10px; box-shadow: 0 18px 55px #000a; }
      .toolbar-popover { top: auto; bottom: calc(100% + 8px); width: 360px; }
      .access-popover { width: 300px; }
      .popover-heading { padding: 7px 9px 10px; color: var(--ink-muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .popover-section-heading { padding: 9px 10px 5px; color: var(--ink-muted); font-size: 10px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
      .menu-option { width: 100%; display: flex; align-items: flex-start; gap: 11px; border: 0; border-radius: 10px; background: transparent; padding: 10px; text-align: left; cursor: pointer; }
      .menu-option:hover { background: var(--tool-hover); }
      .menu-option.selected { background: var(--raised-tool); }
      .radio { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px; border: 1px solid var(--steel-line); border-radius: 50%; }
      .selected .radio { border: 5px solid var(--amber-signal); }
      .menu-option small { display: block; margin-top: 2px; color: var(--ink-muted); }
      .menu-option-icon { display: grid; flex: 0 0 auto; width: 28px; height: 28px; place-items: center; border-radius: 8px; background: var(--raised-tool); color: var(--ink-soft); }
      .menu-option-icon .icon { width: 15px; height: 15px; }
      .menu-shortcut { margin-left: auto; padding-top: 1px; color: var(--ink-muted); font: 11px ui-monospace, monospace; }
      .menu-divider { height: 1px; margin: 7px 5px; background: var(--quiet-line); }
      .menu-ref { display: flex; align-items: center; justify-content: space-between; padding: 8px 9px; color: var(--ink-muted); font-size: 12px; }
      .menu-ref button { border: 0; border-radius: 7px; background: var(--raised-tool); padding: 7px 9px; color: var(--ink-soft); cursor: pointer; }
      .menu-note { margin: 6px 9px 7px; color: var(--ink-muted); font-size: 11px; line-height: 1.5; }
      .branch-popover { width: 315px; }
      .branch-popover .branch-list { padding: 0 2px 2px; }

      .run-target { border: 1px solid transparent; }
      .run-target:hover { border-color: var(--quiet-line); }
      .target-popover { width: 430px; }
      .target-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .target-card { position: relative; min-width: 0; border: 1px solid var(--quiet-line); border-radius: 12px; background: var(--raised-tool); padding: 12px; text-align: left; cursor: pointer; }
      .target-card.selected { border-color: color-mix(in srgb, var(--amber-signal) 70%, var(--steel-line)); background: color-mix(in srgb, var(--amber-signal) 6%, var(--raised-tool)); }
      .target-card strong { display: block; font-size: 13px; }
      .target-card small { display: block; margin-top: 4px; color: var(--ink-muted); line-height: 1.45; }
      .target-summary { margin: 10px 2px 1px; border-radius: 9px; background: var(--raised-tool); padding: 9px 10px; color: var(--ink-muted); font-size: 11px; }

      .guided-frame { padding-bottom: 0; }
      .guided-setup { margin: 0 12px; border: 1px solid var(--steel-line); border-bottom: 0; border-radius: 18px 18px 0 0; background: var(--tool-tray); padding: 18px; }
      .guided-head { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
      .guided-head strong { font-size: 14px; }
      .guided-head p { margin: 3px 0 0; color: var(--ink-muted); font-size: 11px; }
      .guided-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .guided-step { min-width: 0; }
      .step-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--ink-soft); font-size: 12px; font-weight: 650; }
      .step-number { display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; background: var(--raised-tool); color: var(--amber-signal); font-size: 10px; }
      .guided-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      .guided-choice { border: 1px solid var(--quiet-line); border-radius: 11px; background: var(--raised-tool); padding: 10px; text-align: left; cursor: pointer; }
      .guided-choice.selected { border-color: var(--amber-signal); }
      .guided-choice small { display: block; margin-top: 3px; color: var(--ink-muted); }
      .branch-list { display: grid; gap: 5px; }
      .branch-option { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--quiet-line); border-radius: 9px; background: var(--raised-tool); padding: 9px 10px; cursor: pointer; }
      .branch-option.selected { border-color: var(--amber-signal); }
      .branch-option small { color: var(--ink-muted); }
      .guided-result { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 14px; border-radius: 10px; background: var(--raised-tool); padding: 10px 12px; color: var(--ink-muted); font-size: 11px; }
      .guided-result strong { color: var(--ink-soft); }
      .done-button { border: 0; border-radius: 8px; background: var(--amber-signal); padding: 8px 13px; color: #17191c; font-weight: 700; cursor: pointer; }
      .guided-frame .composer { border-radius: 0 0 29px 29px; }

      .switcher { position: fixed; z-index: 30; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; border: 1px solid #d4d8e0; border-radius: 999px; background: var(--paper); padding: 4px; color: #17191c; box-shadow: 0 14px 38px #0009; }
      .switcher button { display: grid; width: 32px; height: 32px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #17191c; cursor: pointer; }
      .switcher button:hover { background: #dfe3e9; }
      .switcher-label { min-width: 175px; text-align: center; font-size: 12px; font-weight: 750; }

      @media (max-width: 760px) {
        .study { padding: 22px 14px 88px; }
        .study-header { display: block; }
        .mock-only { width: fit-content; margin-top: 14px; }
        .stage { padding-top: 48px; }
        .variant-intro { display: block; }
        .variant-intro span { display: block; margin-top: 5px; text-align: left; }
        .preflight { gap: 4px 10px; padding: 8px 14px; font-size: 13px; }
        .prompt { min-height: 130px; padding: 18px; font-size: 15px; }
        .toolbar { align-items: flex-end; padding-inline: 12px; }
        .model { max-width: 95px; overflow: hidden; text-overflow: ellipsis; }
        .effort, .context-ring { display: none; }
        .popover, .target-popover { position: fixed; top: auto; right: 12px; bottom: 76px; left: 12px; width: auto; }
        .guided-grid { grid-template-columns: 1fr; }
        .guided-result { align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7.5h7l2 2h9v9.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7.5V5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v2.5"/></symbol>
      <symbol id="branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 7v10M8 11h4a6 6 0 0 0 6-3"/></symbol>
      <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 5 3 8 7 10 4-2 7-5 7-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="paperclip" viewBox="0 0 24 24"><path d="m9 12 6-6a3 3 0 0 1 4 4l-8 8a5 5 0 0 1-7-7l8-8"/></symbol>
      <symbol id="at" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></symbol>
      <symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5zM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></symbol>
      <symbol id="waggle" viewBox="0 0 24 24"><path d="M7 8c2-3 8-3 10 0M6 12c3-2 9-2 12 0M8 16c2-1 6-1 8 0"/><circle cx="12" cy="19" r="1"/></symbol>
      <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
      <symbol id="send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
      <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="laptop" viewBox="0 0 24 24"><path d="M5 5h14v11H5zM3 19h18"/></symbol>
    </svg>

    <main class="study">
      <header class="study-header">
        <div>
          <div class="eyebrow">OpenWaggle design study</div>
          <h1>Codex-shaped composer, OpenWaggle behavior</h1>
          <p>Every variant keeps the Codex hierarchy. Only the worktree decision changes. The controls below update browser memory and never touch Git.</p>
        </div>
        <div class="mock-only">HTML prototype · no app runtime</div>
      </header>
      <section class="stage">
        <div class="variant-intro"><strong id="variant-title"></strong><span id="variant-description"></span></div>
        <div id="prototype"></div>
      </section>
    </main>

    <nav class="switcher" aria-label="Prototype variants">
      <button data-cycle="-1" aria-label="Previous prototype">←</button>
      <div class="switcher-label" id="switcher-label"></div>
      <button data-cycle="1" aria-label="Next prototype">→</button>
    </nav>

    <script>
      const variants = ['A', 'B', 'C']
      const copy = {
        A: { title: 'A · Current direction', description: 'Codex-shaped hierarchy with work location and base branch kept as independent decisions.' },
        B: { title: 'B · Single run target', description: 'The same Codex structure, with environment mode and base branch consolidated into one OpenWaggle run target.' },
        C: { title: 'C · Guided first run', description: 'The same structure, with a two-step worktree explanation before the first send and a compact summary afterwards.' },
      }
      const requested = new URLSearchParams(location.search).get('variant')
      const requestedDemo = new URLSearchParams(location.search).get('demo')
      const demoPhases = ['creating', 'checking', 'ready']
      const initialPhase = demoPhases.includes(requestedDemo) ? requestedDemo : 'compose'
      const state = {
        variant: variants.includes(requested) ? requested : 'A',
        mode: 'worktree',
        ref: 'main',
        access: 'yolo',
        panel: stateFromVariant(requested),
        guidedComplete: false,
        phase: initialPhase,
        prompt: initialPhase === 'compose' ? '' : 'Redesign the composer while keeping OpenWaggle identity.',
        detailsOpen: false,
      }
      let launchTimers = []
      const root = document.querySelector('#prototype')
      const title = document.querySelector('#variant-title')
      const description = document.querySelector('#variant-description')
      const switcherLabel = document.querySelector('#switcher-label')

      function stateFromVariant(variant) { return variant === 'C' ? 'guided' : null }
      function icon(name, className = '') { return `<svg class="icon ${className}"><use href="#${name}"></use></svg>` }
      function targetLabel() { return state.mode === 'worktree' ? 'New local worktree' : 'Current checkout' }
      function refLabel() { return state.ref }

      function preflight(mode = 'separate') {
        const locked = state.variant === 'A' && state.phase !== 'compose'
        const destination = mode === 'combined' ? `${targetLabel()}${state.mode === 'worktree' ? ` from ${state.ref}` : ` on ${state.ref}`}` : targetLabel()
        return `<div class="preflight">
          <div class="preflight-item"><span class="brand-mark">OW</span><span>OpenWaggle</span></div>
          ${locked ? `<div class="preflight-item">${icon('branch')}<span>${state.mode === 'worktree' ? 'Local worktree' : 'Current checkout'}</span></div>` : `<div class="dropdown-wrap"><button class="preflight-button ${mode === 'combined' ? 'run-target' : ''}" data-panel="target" aria-expanded="${state.panel === 'target'}">${icon('branch')}<span>${destination}</span>${icon('chevron', 'chevron')}</button>${state.panel === 'target' && state.variant !== 'C' ? worktreePopover(mode) : ''}</div>`}
          ${mode === 'separate' ? locked ? `<div class="preflight-item">${icon('branch')}<span>${state.mode === 'worktree' ? 'ow/session-01a…' : refLabel()}</span></div>` : `<div class="dropdown-wrap"><button class="preflight-button" data-panel="branch" aria-expanded="${state.panel === 'branch'}">${icon('branch')}<span>${refLabel()}</span>${icon('chevron', 'chevron')}</button>${state.panel === 'branch' ? branchPopover() : ''}</div>` : ''}
        </div>`
      }

      function toolbar() {
        return `<div class="toolbar">
          <div class="toolbar-cluster">
            <div class="dropdown-wrap"><button class="icon-button" data-panel="plus" aria-label="Add context" aria-expanded="${state.panel === 'plus'}">${icon('plus')}</button>${state.panel === 'plus' ? plusPopover() : ''}</div>
            <div class="dropdown-wrap"><button class="text-button access-button" data-panel="access" aria-expanded="${state.panel === 'access'}">${icon('shield')}<span>${state.access === 'yolo' ? 'YOLO' : 'Ask for approval'}</span>${icon('chevron', 'chevron')}</button>${state.panel === 'access' ? accessPopover() : ''}</div>
          </div>
          <div class="toolbar-cluster"><button class="text-button model"><span class="brand-mark">OW</span><span>GPT-5.6 Sol</span>${icon('chevron', 'chevron')}</button><button class="text-button effort">Medium${icon('chevron', 'chevron')}</button><div class="context-ring">0</div><button class="icon-button" aria-label="Voice input">${icon('mic')}</button><button class="icon-button send-button" data-action="submit" aria-label="Send">${icon('send')}</button></div>
        </div>`
      }

      function plusPopover() {
        return `<div class="popover toolbar-popover">
          <div class="popover-heading">Add to your message</div>
          <div class="popover-section-heading">Add context</div>
          ${plusOption('paperclip', 'Attach files', 'Text, images, or PDFs · up to 5', '')}
          ${plusOption('at', 'Reference project file', 'Search and insert a file from this project', 'type @')}
          <div class="menu-divider"></div>
          <div class="popover-section-heading">Choose how to work</div>
          ${plusOption('spark', 'Use a skill', 'Apply an enabled project skill to the task', 'type /')}
          ${plusOption('waggle', 'Start Waggle', 'Run the task with a multi-agent preset', 'type /')}
          <p class="menu-note">Files can also be dropped onto the composer. Long pasted text is converted into an attachment automatically.</p>
        </div>`
      }

      function plusOption(iconName, heading, detail, shortcut) {
        return `<button class="menu-option" data-plus-action="${heading}"><span class="menu-option-icon">${icon(iconName)}</span><span><strong>${heading}</strong><small>${detail}</small></span>${shortcut ? `<span class="menu-shortcut">${shortcut}</span>` : ''}</button>`
      }

      function accessPopover() {
        return `<div class="popover toolbar-popover access-popover">
          <div class="popover-heading">Agent access</div>
          ${accessOption('yolo', 'YOLO (Full Access)', 'Run tools without asking for approval.')}
          ${accessOption('ask', 'Ask for approval', 'Pause before actions that need permission.')}
          <p class="menu-note">This choice applies to the session.</p>
        </div>`
      }

      function accessOption(value, heading, detail) {
        return `<button class="menu-option ${state.access === value ? 'selected' : ''}" data-access="${value}"><span class="radio"></span><span><strong>${heading}</strong><small>${detail}</small></span></button>`
      }

      function composer(extraClass = '') {
        return `<div class="composer ${extraClass}"><textarea class="prompt" placeholder="Ask anything · / skills & Waggle · @ files">${escapeHtml(state.phase === 'compose' ? state.prompt : '')}</textarea>${toolbar()}</div>`
      }

      function escapeHtml(value) {
        return value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;')
      }

      function modeOption(mode, titleText, detail) {
        return `<button class="menu-option ${state.mode === mode ? 'selected' : ''}" data-mode="${mode}"><span class="radio"></span><span><strong>${titleText}</strong><small>${detail}</small></span></button>`
      }

      function worktreePopover(style) {
        if (style === 'combined') {
          return `<div class="popover target-popover"><div class="popover-heading">Run target</div><div class="target-choices">${targetCard('local', 'Current checkout', 'Use the checkout already open in OpenWaggle.')}${targetCard('worktree', 'New local worktree', 'Create an isolated checkout on the first send.')}</div>${state.mode === 'worktree' ? branchPicker() : ''}<div class="target-summary">${runSummary()}</div></div>`
        }
        return `<div class="popover"><div class="popover-heading">Run task in</div>${modeOption('local', 'Current checkout', 'The agent edits the checkout you opened.')}${modeOption('worktree', 'New local worktree', 'The agent receives an isolated checkout.')}<div class="menu-divider"></div><p class="menu-note">${state.mode === 'worktree' ? 'OpenWaggle creates the worktree on the first send. Choose its starting branch in the separate branch control.' : 'The agent works directly in the checkout already open in OpenWaggle.'}</p></div>`
      }

      function branchPopover() {
        return `<div class="popover branch-popover"><div class="popover-heading">Start from branch</div><div class="branch-list">${branchOption('main', 'Current branch')}${branchOption('feat/composer-study', 'Local branch')}${branchOption('origin/main', 'Remote branch')}</div><p class="menu-note">${state.mode === 'worktree' ? 'The new worktree starts from this ref.' : 'The current checkout uses this branch.'}</p></div>`
      }

      function targetCard(mode, heading, detail) {
        return `<button class="target-card ${state.mode === mode ? 'selected' : ''}" data-mode="${mode}"><strong>${heading}</strong><small>${detail}</small></button>`
      }

      function branchPicker() {
        return `<div class="menu-ref"><span>Base branch</span><button data-action="cycle-ref">${icon('branch')} ${state.ref} ${icon('chevron', 'chevron')}</button></div>`
      }

      function runSummary() {
        return state.mode === 'worktree' ? `Creates an OpenWaggle-owned worktree from <strong>${state.ref}</strong> when you send.` : `Runs directly on <strong>${state.ref}</strong> in the current checkout.`
      }

      function guidedSetup() {
        if (state.guidedComplete && state.panel !== 'guided') return ''
        return `<div class="guided-setup">
          <div class="guided-head"><div><strong>Set up this run</strong><p>OpenWaggle will remember this choice for the session.</p></div></div>
          <div class="guided-grid">
            <div class="guided-step"><div class="step-label"><span class="step-number">1</span>Where should the agent work?</div><div class="guided-choices">${guidedChoice('local', 'Current checkout', 'Edits open files')}${guidedChoice('worktree', 'New worktree', 'Keeps work isolated')}</div></div>
            <div class="guided-step"><div class="step-label"><span class="step-number">2</span>${state.mode === 'worktree' ? 'Which branch should it start from?' : 'Which branch should be checked out?'}</div><div class="branch-list">${branchOption('main', 'Current branch')}${branchOption('feat/composer-study', 'Local branch')}${branchOption('origin/main', 'Remote branch')}</div></div>
          </div>
          <div class="guided-result"><span>${state.mode === 'worktree' ? `Creates <strong>a new session worktree</strong> from <strong>${state.ref}</strong> after you send. Your current checkout stays untouched.` : `Runs in the <strong>current checkout</strong> on <strong>${state.ref}</strong>. Local changes are visible to the agent.`}</span><button class="done-button" data-action="complete">Done</button></div>
        </div>`
      }

      function guidedChoice(mode, heading, detail) {
        return `<button class="guided-choice ${state.mode === mode ? 'selected' : ''}" data-mode="${mode}"><strong>${heading}</strong><small>${detail}</small></button>`
      }

      function branchOption(ref, detail) {
        return `<button class="branch-option ${state.ref === ref ? 'selected' : ''}" data-ref="${ref}"><span>${icon('branch')} ${ref}</span><small>${detail}</small></button>`
      }

      function variantA() {
        if (state.phase === 'compose') return `<div class="codex-frame">${preflight('separate')}${composer()}</div>`
        return `<div class="codex-frame">${preflight('separate')}${conversation()}${composer('conversation-composer')}</div>`
      }
      function variantB() { return `<div class="codex-frame">${preflight('combined')}${composer()}</div>` }
      function variantC() { return `<div class="codex-frame guided-frame">${preflight('separate')}${guidedSetup()}${composer()}</div>` }

      function conversation() {
        if (state.mode !== 'worktree') {
          return `<div class="conversation">
            <div class="user-turn"><div class="user-bubble">${escapeHtml(state.prompt)}</div></div>
            <div class="assistant-start"><div class="assistant-start-head"><span class="brand-mark">OW</span>GPT-5.6 Sol · Current checkout</div>I’ll start in the checkout already open in OpenWaggle.<span class="stream-cursor"></span></div>
          </div>`
        }
        const preparingClass = state.phase === 'creating' ? 'active' : 'complete'
        const checkoutClass = state.phase === 'checking' ? 'active' : ''
        const worktreeReady = state.phase === 'ready'
        return `<div class="conversation">
          <div class="user-turn"><div class="user-bubble">${escapeHtml(state.prompt)}</div></div>
          ${state.phase !== 'streaming' ? `<div class="worktree-event" aria-live="polite">
            <div class="worktree-event-title">${icon('branch')}<span>${worktreeReady ? 'Worktree created' : 'Creating a worktree'}</span></div>
            ${worktreeReady ? `<div class="starting-task"><span class="setup-dot"></span><span>Starting a task</span></div>` : `<div class="worktree-setup">
              <div class="setup-status ${preparingClass}"><span class="setup-dot"></span><span class="setup-status-copy">Preparing workspace</span></div>
              <div class="setup-status ${checkoutClass}"><span class="setup-dot"></span><span class="setup-status-copy">Checking out files</span>${state.phase === 'checking' ? `<span class="setup-progress"><span class="setup-progress-track"><span class="setup-progress-fill"></span></span><span>64%</span></span>` : ''}</div>
              ${state.detailsOpen ? worktreeOutput() : ''}
              <div class="setup-footer">
                <button class="setup-link" data-action="details" aria-expanded="${state.detailsOpen}">${icon('chevron', 'chevron')}<span>${state.detailsOpen ? 'Less details' : 'More details'}</span></button>
                <div class="setup-actions"><button class="setup-action" data-action="work-locally">${icon('laptop')}<span>Work locally</span></button><button class="setup-action" data-action="cancel-launch"><span>×</span><span>Cancel</span></button></div>
              </div>
            </div>`}
          </div>` : ''}
          ${state.phase === 'streaming' ? `<div class="assistant-start"><div class="assistant-start-head"><span class="brand-mark">OW</span><span>GPT-5.6 Sol</span><button class="replay-button" data-action="replay">Replay setup</button></div>I’ll inspect the composer flow and map the worktree transition first.<span class="stream-cursor"></span></div>` : ''}
        </div>`
      }

      function worktreeOutput() {
        return `<div class="setup-output">$ git worktree add --detach … ${state.ref}\nPreparing worktree (new branch 'ow/session-01a…')\n${state.phase === 'checking' ? 'Updating files: 64% (418/653)' : 'Resolving base ref and worktree location…'}</div>`
      }

      function clearLaunchTimers() {
        for (const timer of launchTimers) clearTimeout(timer)
        launchTimers = []
      }

      function startWorktreeLaunch() {
        const textarea = document.querySelector('.prompt')
        const prompt = textarea?.value.trim() || 'Help me improve the composer experience.'
        state.prompt = prompt
        state.panel = null
        state.detailsOpen = false
        clearLaunchTimers()
        if (state.mode !== 'worktree') {
          state.phase = 'streaming'
          render()
          return
        }
        state.phase = 'creating'
        render()
        launchTimers.push(setTimeout(() => { state.phase = 'checking'; render() }, 4000))
        launchTimers.push(setTimeout(() => { state.phase = 'ready'; render() }, 8000))
        launchTimers.push(setTimeout(() => { state.phase = 'streaming'; render() }, 10500))
      }

      function render() {
        root.innerHTML = state.variant === 'A' ? variantA() : state.variant === 'B' ? variantB() : variantC()
        title.textContent = copy[state.variant].title
        description.textContent = copy[state.variant].description
        switcherLabel.textContent = copy[state.variant].title
        const url = new URL(location.href)
        url.searchParams.set('variant', state.variant)
        history.replaceState(null, '', url)
      }

      function cycleVariant(offset) {
        clearLaunchTimers()
        const index = variants.indexOf(state.variant)
        state.variant = variants[(index + offset + variants.length) % variants.length]
        state.panel = state.variant === 'C' && !state.guidedComplete ? 'guided' : null
        state.phase = 'compose'
        render()
      }

      document.addEventListener('click', event => {
        const button = event.target.closest('button')
        if (!button) return
        if (button.dataset.cycle) return cycleVariant(Number(button.dataset.cycle))
        if (button.dataset.panel) state.panel = state.panel === button.dataset.panel ? null : button.dataset.panel
        if (button.dataset.mode) { state.mode = button.dataset.mode; state.panel = state.variant === 'C' ? 'guided' : null }
        if (button.dataset.ref) { state.ref = button.dataset.ref; state.panel = state.variant === 'C' ? 'guided' : null }
        if (button.dataset.access) { state.access = button.dataset.access; state.panel = null }
        if (button.dataset.plusAction) state.panel = null
        if (button.dataset.action === 'cycle-ref') state.ref = state.ref === 'main' ? 'feat/composer-study' : 'main'
        if (button.dataset.action === 'submit') return startWorktreeLaunch()
        if (button.dataset.action === 'replay') { state.phase = 'compose'; render(); return setTimeout(startWorktreeLaunch, 80) }
        if (button.dataset.action === 'details') state.detailsOpen = !state.detailsOpen
        if (button.dataset.action === 'work-locally') { clearLaunchTimers(); state.mode = 'local'; state.phase = 'streaming' }
        if (button.dataset.action === 'cancel-launch') { clearLaunchTimers(); state.phase = 'compose'; state.panel = null }
        if (button.dataset.action === 'complete') { state.guidedComplete = true; state.panel = null }
        render()
      })

      document.addEventListener('input', event => {
        if (event.target.matches('.prompt') && state.phase === 'compose') state.prompt = event.target.value
      })

      document.addEventListener('keydown', event => {
        if (event.target.matches('.prompt') && event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault()
          startWorktreeLaunch()
          return
        }
        if ((event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') || ['TEXTAREA', 'INPUT', 'SELECT'].includes(event.target.tagName)) return
        cycleVariant(event.key === 'ArrowRight' ? 1 : -1)
      })

      render()
    </script>
  </body>
</html>
