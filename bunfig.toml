# Bun install settings. Workspaces, catalogs, overrides, patches, package extensions and the
# build-script allowlist (`trustedDependencies`) live in package.json; docs/dependency-updates.md
# explains each of them.

[install]
# Strict layout like pnpm's: a package resolves only what it declares (plus the store fallback).
linker = "isolated"
# `bun add` writes exact versions; check:repository-standards rejects ranges
# (docs/dependency-updates.md).
exact = true

# Supply-chain hardening: refuse releases younger than seven days, so a hijacked publish has time
# to be noticed and unpublished before it reaches this repository. Bun has no equivalent of pnpm's
# `trustPolicy: no-downgrade`; `bun run check:provenance` (scripts/check-provenance-downgrade.ts)
# fails a locked version that lost the npm provenance earlier versions had.
minimumReleaseAge = 604800

# Each exception is one exact version with its reason. Remove an entry once that version is seven
# days old; it exempts nothing after that. Pi entries are dated by the marker line below, which
# check:pi-runtime enforces.
minimumReleaseAgeExcludes = [
  # The author's own package (ADR-adopted pattern-matching library); every version is exempt.
  "@diegogbrisa/ts-match",
]

[run]
# `bun run <script>` does not echo `$ <command>`: agents read this output, and the script name
# already says what runs.
silent = true
