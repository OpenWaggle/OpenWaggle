# Bun install settings. Workspaces, catalogs, overrides, patches, package extensions and the
# build-script allowlist (`trustedDependencies`) live in package.json; docs/dependency-updates.md
# explains each of them.

[install]
# Strict layout like pnpm's: a package resolves only what it declares (plus the store fallback).
linker = "isolated"
# `bun add` writes exact versions; check:repository-standards rejects ranges
# (docs/dependency-updates.md).
exact = true
# Never resolve a missing package from Bun's global cache at run time. Without a node_modules
# directory (a scratch repository in a test, a script run outside the checkout) Bun would
# otherwise load whatever version it has cached instead of failing.
auto = "disable"

# Supply-chain hardening: refuse releases younger than seven days, so a hijacked publish has time
# to be noticed and unpublished before it reaches this repository. Bun has no equivalent of pnpm's
# `trustPolicy: no-downgrade`; `bun run check:provenance` (scripts/check-provenance-downgrade.ts)
# fails a locked version that lost the npm provenance earlier versions had.
minimumReleaseAge = 604800

# Each exception is one exact `name@version` with its reason, @diegogbrisa/ts-match included.
# Remove an entry once that version is seven days old; it exempts nothing after that. Pi entries
# are dated by a `pi-runtime-release-age-exclusions-expire` marker line, which check:pi-runtime
# enforces (docs/pi-runtime-upgrades.md).
minimumReleaseAgeExcludes = [
  # Pi 1.6.0 is the matched release the patches are ported to; the marker below dates the entries.
  "@earendil-works/pi-agent-core@1.6.0",
  "@earendil-works/pi-ai@1.6.0",
  "@earendil-works/pi-codemode@1.6.0",
  "@earendil-works/pi-coding-agent@1.6.0",
  "@earendil-works/pi-mcp@1.6.0",
  # pi-ai 1.6.0 depends on it exactly; it ships with the release but is not catalog-pinned.
  "@earendil-works/pi-schema@1.6.0",
  "@earendil-works/pi-telemetry@1.6.0",
  "@earendil-works/pi-tui@1.6.0",
  # Pinned exactly by pi-ai 1.6.0. Remove once 7.59.0 is seven days old (2026-11-24T22:54:04Z).
  "openai@7.59.0",
]
# pi-runtime-release-age-exclusions-expire: 2026-11-27T11:09:16Z

[run]
# `bun run <script>` does not echo `$ <command>`: agents read this output, and the script name
# already says what runs.
silent = true
